// ---------- Probar IA ----------
const HERR = { consultar_horarios: '🕒 Consultó horarios', consultar_tarifas: '💶 Consultó tarifas', calcular_primer_recibo: '🧮 Calculó el primer recibo', preparar_alta: '📝 Preparó un alta', reservar_prueba_parla: '📅 Pidió clase de prueba', derivar_a_equipo: '🙋 Derivó al equipo' };
const resumirJson = (o) => esc(Object.entries(o || {}).map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ')).slice(0, 400);
const fechaLocal = (iso) => { const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };

async function probar() {
  const p = estado.prueba;
  const [listaP] = await Promise.all([api('/probar/conversaciones'), estado.opciones ? null : cargarOpciones()]);
  if (estado.seccion !== 'probar') return;
  p.lista = listaP;
  const desdeHash = location.hash.split('/')[1];
  if (desdeHash && listaP.some((c) => c.id === desdeHash)) p.id = desdeHash;
  if (p.id && !listaP.some((c) => c.id === p.id)) p.id = null;
  const disponible = estado.info.modelo_configurado;
  $('#main').innerHTML = `<div class="cab-seccion"><h2>Probar IA</h2><span class="ayuda">Nada sale a GHL, AimHarder ni a ningún lead. Las etiquetas son las reales.</span></div>
    ${disponible ? '' : '<div class="aviso" role="status">Para que Sofía responda falta configurar la clave de Anthropic en el VPS. Puedes preparar pruebas igualmente.</div>'}
    <div class="probar2 ${p.id ? 'con-prueba' : ''} ${p.movil ? 'movil' : ''}" id="p2">
      <aside class="p-lista"><div class="p-nueva"><select id="pcanal" aria-label="Canal de la prueba nueva"><option value="whatsapp">WhatsApp</option><option value="instagram">Instagram</option></select><button class="primario" id="pnueva">+ Nueva prueba</button></div>
        <div id="plista"></div>${listaP.length ? '<button id="pborrartodo" class="suave peligro-t">Borrar todas</button>' : ''}</aside>
      <section class="p-chat" id="pchat"><div class="vacio">Crea una prueba o elige una de la lista.<br><span class="ayuda">Elige WhatsApp o Instagram y escribe como si fueras un lead.</span></div></section>
      <aside class="p-analisis" id="panal"></aside>
    </div>`;
  pintarListaP();
  $('#pnueva').onclick = async () => { const d = await api('/probar/conversaciones', { method: 'POST', body: JSON.stringify({ canal: $('#pcanal').value }) }); p.id = d.conv.id; p.datos = d; history.replaceState(null, '', '#probar/' + p.id); probar(); };
  $('#pborrartodo') && ($('#pborrartodo').onclick = async () => {
    const b = $('#pborrartodo'); if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = `¿Borrar las ${listaP.length} pruebas?`; return; }
    await api('/probar/conversaciones', { method: 'DELETE' }); p.id = null; history.replaceState(null, '', '#probar'); probar();
  });
  if (p.id) await abrirPrueba(p.id);
}

function pintarListaP() {
  const p = estado.prueba;
  $('#plista').innerHTML = p.lista.length ? p.lista.map((c) => `<div class="p-item ${c.id === p.id ? 'activo' : ''}"><button type="button" class="p-abrir" data-p="${esc(c.id)}">
      <span class="fila"><b>${esc(c.nombre)}</b><span class="chip">${esc(CANAL[c.canal] || c.canal)}</span></span>
      <span class="ult">${esc(c.ultimo?.texto || 'Sin mensajes')}</span>
      <span class="ayuda">${c.mensajes} msgs${c.fase ? ' · ' + esc(c.fase) : ''} · ${hora(c.updated_at)}</span></button>
      <button type="button" class="x" data-pdel="${esc(c.id)}" aria-label="Borrar ${esc(c.nombre)}">✕</button></div>`).join('') : '<div class="vacio">Sin pruebas</div>';
  $('#plista').querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { p.id = b.dataset.p; history.replaceState(null, '', '#probar/' + p.id); $('#p2').classList.add('con-prueba'); pintarListaP(); abrirPrueba(p.id); });
  $('#plista').querySelectorAll('[data-pdel]').forEach((b) => b.onclick = async () => {
    await api('/probar/conversaciones/' + encodeURIComponent(b.dataset.pdel), { method: 'DELETE' });
    if (p.id === b.dataset.pdel) { p.id = null; history.replaceState(null, '', '#probar'); }
    probar();
  });
}

async function abrirPrueba(id) {
  const d = await api('/probar/conversaciones/' + encodeURIComponent(id));
  if (estado.seccion !== 'probar' || estado.prueba.id !== id) return;
  pintarPrueba(d);
}

function pintarPrueba(d, escribiendo = false) {
  const p = estado.prueba; p.datos = d;
  const c = d.conv; const disponible = estado.info.modelo_configurado;
  const sim = c.simulacion || {};
  const ETQ = { lead: 'Lead', ia: 'Sofía', sistema: 'Sistema', humano: 'Equipo' };
  $('#pchat').innerHTML = `<div class="cab"><div><button class="volver" id="pvolver">Pruebas</button> <b>${esc(c.nombre)}</b> <span class="chip">${esc(CANAL[c.canal])}</span>
      ${['prompt', 'negocio'].some((doc) => d.instrucciones?.[doc] && d.instrucciones[doc].estado !== 'produccion') ? `<div class="chip azul" style="margin:3px 0">Probando ${['prompt', 'negocio'].filter((doc) => d.instrucciones?.[doc]?.estado !== 'produccion').map((doc) => `${doc === 'prompt' ? 'prompt' : 'base de conocimiento'} v${d.instrucciones[doc].version}`).join(' y ')}</div>` : ''}
      <div class="ayuda">${sim.fecha ? `🕒 La IA cree que es ${new Date(d.ahora).toLocaleString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}` : 'Hora real'}${sim.telefono ? ` · 📱 ${esc(sim.telefono)}` : ''}</div></div>
      <div class="p-botones">
        <button type="button" id="psim" aria-expanded="${Boolean(p.verSim)}">Simular…</button>
        <button type="button" id="pinicia" ${disponible && !escribiendo ? '' : 'disabled'} title="Sofía escribe el primer mensaje (flujo outbound)">IA inicia</button>
        <button type="button" id="pmovil" aria-pressed="${Boolean(p.movil)}">${p.movil ? 'Vista escritorio' : 'Vista móvil'}</button>
        <button type="button" id="pexp">Exportar</button>
        <button type="button" id="plink" title="Copia un enlace directo a esta prueba">Copiar enlace</button>
      </div></div>
    ${p.verSim ? `<form class="p-sim" id="psimf"><label>Teléfono simulado <input id="pstel" value="${esc(sim.telefono || '')}" placeholder="+34 600 000 000" inputmode="tel"></label>
      <label>Fecha y hora <input id="psfecha" type="datetime-local" value="${sim.fecha ? fechaLocal(sim.fecha) : ''}"></label>
      <label>Nombre <input id="psnom" value="${esc(c.nombre)}" maxlength="60"></label>
      ${Object.entries(DOC_NOMBRE).map(([doc, n]) => `<label>${n} <select data-borr="${doc}">${(p.versiones?.[doc]?.versiones || []).filter((v) => v.estado !== 'archivada' || d.instrucciones?.[doc]?.id === v.id).map((v) => `<option value="${v.estado === 'produccion' ? '' : v.id}" ${d.instrucciones?.[doc]?.id === v.id ? 'selected' : ''}>v${v.version} · ${v.estado === 'produccion' ? 'producción' : v.estado}</option>`).join('')}</select></label>`).join('')}
      <button class="primario">Aplicar</button><button type="button" id="psreal">Hora y teléfono reales</button>
      <p class="ayuda">Con el teléfono de un socio, Sofía lo detecta como socio (índice real de AimHarder). La fecha cambia el «hoy» de Sofía y su horario.</p></form>` : ''}
    <div class="msgs p-msgs" id="pm">${d.mensajes.map((m) => `<div class="burbuja b-${esc(m.autor)}">${botonReporte(m)}${medioHtml(m, `/probar/conversaciones/${encodeURIComponent(c.id)}`)}${esc(textoSinMarcador(m))}<div class="meta">${esc(ETQ[m.autor] || m.autor)} · ${hora(m.created_at)}</div></div>`).join('') || '<div class="vacio">Escribe el primer mensaje como si fueras un lead, o pulsa «IA inicia».</div>'}
      ${escribiendo ? '<div class="burbuja b-sistema" role="status">Sofía está escribiendo…</div>' : ''}</div>
    <form id="pf" class="p-form"><input type="file" id="pfile" accept="audio/*,image/*" hidden>
      <button type="button" id="padj" class="icono" title="Enviar una imagen o un audio como el lead" aria-label="Adjuntar imagen o audio" ${disponible && !escribiendo ? '' : 'disabled'}>📎</button>
      <button type="button" id="pgrab" class="icono ${p.grabando ? 'grabando' : ''}" title="${p.grabando ? 'Parar y enviar la nota de voz' : 'Grabar una nota de voz'}" aria-label="${p.grabando ? 'Parar y enviar la nota de voz' : 'Grabar una nota de voz'}" ${disponible && !escribiendo ? '' : 'disabled'}>${p.grabando ? '⏹️' : '🎙️'}</button>
      <textarea id="pt" rows="1" aria-label="Mensaje de prueba" placeholder="Escribe como un lead de ${esc(CANAL[c.canal])}…" title="Intro envía · Mayús+Intro, salto de línea" ${disponible && !escribiendo ? '' : 'disabled'}></textarea><button class="primario" ${disponible && !escribiendo ? '' : 'disabled'}>Enviar</button></form>`;
  $('#pm').scrollTop = 1e9;
  cargarMedios($('#pm'));
  $('#pm').querySelectorAll('[data-rep]').forEach((b) => b.onclick = () => abrirReporte(b, `/probar/conversaciones/${encodeURIComponent(c.id)}`, Number(b.dataset.rep)));
  pintarAnalisis(d, escribiendo);
  const enviar = async (ruta, cuerpo) => {
    pintarPrueba(d, true);
    try { const nd = await api(ruta, { method: 'POST', body: JSON.stringify(cuerpo || {}) }); if (p.id === c.id) pintarPrueba(nd); }
    catch (err) { const nd = await api('/probar/conversaciones/' + encodeURIComponent(c.id)).catch(() => d); if (p.id === c.id) { pintarPrueba(nd); $('#pm').insertAdjacentHTML('beforeend', `<div class="burbuja b-sistema error">${esc(err.message)}</div>`); } }
    actualizarListaP();
  };
  $('#pvolver').onclick = () => { $('#p2').classList.remove('con-prueba'); };
  $('#pf').onsubmit = (e) => { e.preventDefault(); const t = $('#pt').value.trim(); if (!t) return; d.mensajes.push({ autor: 'lead', texto: t, created_at: new Date().toISOString() }); enviar(`/probar/conversaciones/${encodeURIComponent(c.id)}/mensaje`, { texto: t }); };
  $('#pt').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#pf').requestSubmit(); } };
  $('#pt').oninput = (e) => { e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; };
  if (!escribiendo) $('#pt')?.focus({ preventScroll: true });
  $('#pinicia').onclick = () => enviar(`/probar/conversaciones/${encodeURIComponent(c.id)}/iniciar`);
  const subir = async (blob, nombre) => {
    if (blob.size > 25 * 1024 * 1024) return alertaP('El archivo es demasiado grande (máximo 25 MB).');
    const datos = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
    const texto = $('#pt').value.trim(); $('#pt').value = '';
    const tipo = blob.type.startsWith('image/') ? 'imagen' : 'audio';
    d.mensajes.push({ autor: 'lead', texto: tipo === 'imagen' ? `📷 ${nombre}${texto ? ' · ' + texto : ''}` : `🎙️ nota de voz${texto ? ' · ' + texto : ''}`, created_at: new Date().toISOString() });
    enviar(`/probar/conversaciones/${encodeURIComponent(c.id)}/adjunto`, { datos, mime: blob.type, nombre, texto });
  };
  $('#padj').onclick = () => $('#pfile').click();
  $('#pfile').onchange = (e) => { const f = e.target.files[0]; if (f) subir(f, f.name); };
  $('#pgrab').onclick = async () => {
    if (p.grabando) { p.grabadora.stop(); return; }
    if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') return alertaP('Este navegador no permite grabar audio. Adjunta un archivo de audio.');
    let flujo; try { flujo = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return alertaP('No hay permiso para usar el micrófono.'); }
    const tipos = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/aac'];
    const tipo = tipos.find((t) => MediaRecorder.isTypeSupported?.(t));
    const trozos = []; const rec = new MediaRecorder(flujo, tipo ? { mimeType: tipo } : undefined);
    rec.ondataavailable = (e) => trozos.push(e.data);
    rec.onstop = () => {
      flujo.getTracks().forEach((t) => t.stop()); p.grabando = false;
      const blob = new Blob(trozos, { type: (rec.mimeType || tipo || 'audio/mp4').split(';')[0] });
      pintarPrueba(d);
      if (!blob.size) return alertaP('La grabación ha salido vacía. Mantén pulsado un poco más o adjunta el audio con 📎.');
      subir(blob, 'nota-de-voz.' + (blob.type.includes('ogg') ? 'ogg' : blob.type.includes('webm') ? 'webm' : 'm4a'));
    };
    p.grabadora = rec; p.grabando = true; rec.start(); pintarPrueba(d);
  };
  $('#psim').onclick = async () => { p.verSim = !p.verSim; if (p.verSim) p.versiones = await api('/panel/instrucciones').catch(() => null); pintarPrueba(d); };
  $('#pmovil').onclick = () => { p.movil = !p.movil; $('#p2').classList.toggle('movil', p.movil); pintarPrueba(d); };
  $('#plink').onclick = async () => { const url = location.href.split('#')[0] + '#probar/' + c.id; try { await navigator.clipboard.writeText(url); $('#plink').textContent = 'Enlace copiado'; } catch { prompt('Copia el enlace', url); } };
  $('#pexp').onclick = () => {
    const b = $('#pexp');
    b.outerHTML = `<span class="p-exp"><button type="button" data-exp="1">Con análisis</button><button type="button" data-exp="0">Solo el chat</button></span>`;
    $('#pchat').querySelectorAll('[data-exp]').forEach((x) => x.onclick = () => descargar(`/probar/conversaciones/${encodeURIComponent(c.id)}/exportar?analisis=${x.dataset.exp}`, `prueba_sofia_${c.canal}_${c.id}.txt`));
  };
  $('#psimf') && ($('#psimf').onsubmit = async (e) => {
    e.preventDefault();
    const f = $('#psfecha').value;
    const borradores = Object.fromEntries([...$('#psimf').querySelectorAll('[data-borr]')].map((x) => [x.dataset.borr, x.value ? Number(x.value) : null]));
    const nd = await api('/probar/conversaciones/' + encodeURIComponent(c.id), { method: 'PATCH', body: JSON.stringify({ telefono: $('#pstel').value, fecha: f ? new Date(f).toISOString() : '', nombre: $('#psnom').value, borradores }) });
    p.verSim = false; pintarPrueba(nd); actualizarListaP();
  });
  $('#psreal') && ($('#psreal').onclick = async () => { const nd = await api('/probar/conversaciones/' + encodeURIComponent(c.id), { method: 'PATCH', body: JSON.stringify({ telefono: '', fecha: '' }) }); p.verSim = false; pintarPrueba(nd); });
}

  if ($('#plista')) pintarListaP();

  $('#panal').querySelectorAll('[data-fu]').forEach((b) => b.onclick = async () => {
    pintarPrueba(d, true);
    try { recargar(await api(`/probar/conversaciones/${encodeURIComponent(c.id)}/seguimiento`, { method: 'POST', body: JSON.stringify({ regla: b.dataset.fu }) })); }
    catch (err) { recargar(await api('/probar/conversaciones/' + encodeURIComponent(c.id))); alertaP(err.message); }
  });
}

function alertaP(texto) { $('#pm')?.insertAdjacentHTML('beforeend', `<div class="burbuja b-sistema error" role="alert">${esc(texto)}</div>`); }

async function descargar(ruta, nombre) {
  const cabecera = integrado ? { 'x-metrotools-client': 'zapp' } : { authorization: 'Bearer ' + token };
  const r = await fetch((integrado ? './api' : '/admin') + ruta, { headers: cabecera, cache: 'no-store' });
  if (!r.ok) return alertaP('No se ha podido exportar.');
  const url = URL.createObjectURL(await r.blob());
  const a = Object.assign(document.createElement('a'), { href: url, download: nombre });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ---------- Ajustes (con controles como los de Zapp) y registro de actividad ----------
const DIAS_TXT = [['lunes', 'Lunes'], ['martes', 'Martes'], ['miercoles', 'Miércoles'], ['jueves', 'Jueves'], ['viernes', 'Viernes'], ['sabado', 'Sábado'], ['domingo', 'Domingo']];
async function ajustes() {
  if (location.hash === '#ajustes/actividad') return actividadPagina();

  if (estado.seccion !== 'ajustes') return;
  const sw = (id, on, nombre) => `<label class="interruptor"><input type="checkbox" id="${id}" aria-label="${nombre}" ${on ? 'checked' : ''}><span></span></label>`;

    <div class="ajuste"><div><div class="t">Sofía activa</div><div class="d">Apagada, no contesta ni manda follow-ups: todo lo atiende el equipo en GHL.</div></div>${sw('ia', a.ia_activa, 'Sofía activa')}</div>
    <div class="ajuste"><div><div class="t">WhatsApp</div><div class="d">Sofía contesta en WhatsApp</div></div>${sw('cw', a.canales.whatsapp, 'WhatsApp')}</div>
    <div class="ajuste"><div><div class="t">Instagram</div><div class="d">Sofía contesta en Instagram</div></div>${sw('ci', a.canales.instagram, 'Instagram')}</div>
    <div class="ajuste"><div><div class="t">Horario de respuesta</div><div class="d">Fuera de la franja, los mensajes se guardan y Sofía contesta al empezar el siguiente turno (0 = medianoche; en Zapp: 8 a 0)</div></div>
      <div style="display:flex;gap:6px;align-items:center"><input type="number" id="hi" aria-label="Hora de inicio" min="0" max="23" value="${a.horaInicio}" style="width:64px"> a <input type="number" id="hf" aria-label="Hora de fin" min="0" max="23" value="${a.horaFin}" style="width:64px"></div></div>
    <details class="ajuste-det" ${Object.keys(a.horarioDias || {}).length ? 'open' : ''}><summary>Horario distinto según el día <span class="ayuda">(cerrar un día o darle otra franja)</span></summary><div class="dias-h">${DIAS_TXT.map(filaDia).join('')}</div></details>
    <div class="ajuste"><div><div class="t">Tiempo de respuesta</div><div class="d">Espera al azar antes de contestar, en segundos, como una persona que ve el mensaje y lo lee (en Zapp: 15 a 50)</div></div>
      <div style="display:flex;gap:6px;align-items:center"><input type="number" id="dmin" aria-label="Retraso mínimo" min="0" value="${a.minDelay}" style="width:70px"> a <input type="number" id="dmax" aria-label="Retraso máximo" min="0" value="${a.maxDelay}" style="width:70px"></div></div>
    <div class="ajuste"><div><div class="t">Velocidad de escritura</div><div class="d">Letras por segundo mientras el lead ve «escribiendo…». Cuanto más largo el mensaje, más tarda (en Zapp: 4)</div></div>
      <input type="number" id="vel" aria-label="Velocidad de escritura" min="1" max="20" value="${a.typingSpeed}" style="width:70px"></div>
    <h3>Cuándo se aparta Sofía</h3>
    <div class="ajuste"><div><div class="t">Si escribe alguien del equipo</div><div class="d">Sofía se pausa en ese chat en cuanto una persona del equipo escribe desde GHL. Si lo apagas, solo se pausa con las palabras de abajo.</div></div>${sw('peq', a.pausarSiEquipoEscribe, 'Pausar si escribe el equipo')}</div>
    <div class="ajuste"><div><div class="t">El Cañaveral: plazas de apertura ya ocupadas</div><div class="d">Las que ya se han apuntado por otras vías (web, en persona). Sofía suma las altas que tramita ella y aplica el descuento del tramo que toque: plazas 1-10, 50 %; 11-35, 30 %; 36-110, 20 %; 111-200, 10 %.</div></div><input id="pcan" type="number" min="0" step="1" value="${Number(a.canaveralPlazasOcupadas) || 0}" style="width:90px" aria-label="Plazas de apertura de El Cañaveral ya ocupadas"></div>
    <div class="ajuste"><div><div class="t">Palabras que paran a Sofía</div><div class="d">Si el lead o el equipo las escriben, Sofía se pausa en ese chat. Separadas por comas. Ej: stop ia, hablar con una persona</div></div><input id="ppar" value="${esc((a.palabrasParar || []).join(', '))}" style="width:280px" aria-label="Palabras que paran a Sofía"></div>
    <div class="ajuste"><div><div class="t">Palabras para que vuelva</div><div class="d">Si el equipo las escribe en un chat, Sofía vuelve a contestar ahí. Ej: #sofia</div></div><input id="prea" value="${esc((a.palabrasReanudar || []).join(', '))}" style="width:280px" aria-label="Palabras para reanudar a Sofía"></div>
    <div class="ajuste"><div><div class="t">Chats nuevos que empiezan en pausa</div><div class="d">Sofía no contesta los chats nuevos de ese canal hasta que alguien la active en el chat.</div></div><div class="fila-f"><label class="check"><input type="checkbox" id="pwa" ${a.canalesPausa?.whatsapp ? 'checked' : ''}> WhatsApp</label><label class="check"><input type="checkbox" id="pig" ${a.canalesPausa?.instagram ? 'checked' : ''}> Instagram</label></div></div>

    <div class="ajuste"><div><div class="t">Modelo</div><div class="d">${i.modelo_configurado ? 'Redacta las respuestas de Sofía.' : 'Falta la clave de Anthropic.'}</div></div><span class="chip">${esc(i.modelo)}</span></div>`;
  $('#main').querySelectorAll('[data-dmodo]').forEach((s) => s.onchange = () => { $(`[data-dfr="${s.dataset.dmodo}"]`).hidden = s.value !== 'franja'; });
  $('#bg').onclick = async () => {
    const horarioDias = Object.fromEntries(DIAS_TXT.map(([k]) => { const m = $(`[data-dmodo="${k}"]`).value; return [k, m === 'cerrado' ? null : m === 'franja' ? { desde: Number($(`[data-ddesde="${k}"]`).value), hasta: Number($(`[data-dhasta="${k}"]`).value) } : 'normal']; }));
    try {
      estado.info.ajustes = await api('/panel/ajustes', { method: 'PUT', body: JSON.stringify({
        ia_activa: $('#ia').checked, canales: { whatsapp: $('#cw').checked, instagram: $('#ci').checked },
        horaInicio: Number($('#hi').value), horaFin: Number($('#hf').value), minDelay: Number($('#dmin').value), maxDelay: Number($('#dmax').value), typingSpeed: Number($('#vel').value),
        pausarSiEquipoEscribe: $('#peq').checked, canaveralPlazasOcupadas: Number($('#pcan').value) || 0, palabrasParar: $('#ppar').value, palabrasReanudar: $('#prea').value,
        canalesPausa: { whatsapp: $('#pwa').checked, instagram: $('#pig').checked }, horarioDias,
      }) });
      $('#ok').innerHTML = '<span style="color:var(--green)">Guardado</span>';
      $('#raiz .modo .rojo')?.remove();

    } catch (e) { $('#ok').innerHTML = `<span class="error">${esc(e.message)}</span>`; }
  };
}

async function actividadPagina() {
  const r = await api('/panel/actividad' + (estado.actQuien ? `?quien=${encodeURIComponent(estado.actQuien)}` : ''));
  if (estado.seccion !== 'ajustes') return;
  $('#main').innerHTML = `<div class="cab-seccion"><h2>Registro de actividad</h2><a class="boton" href="#ajustes">Volver a ajustes</a></div>
    <p class="intro">Quién cambió qué desde el panel: etiquetas, seguimientos, instrucciones, ajustes, chats pausados, reportes…</p>
    <div class="filtros"><button data-q="" class="${estado.actQuien ? '' : 'activo'}">Todos</button>${r.personas.map((p) => `<button data-q="${esc(p.quien)}" class="${estado.actQuien === p.quien ? 'activo' : ''}">${esc(p.quien)} <span class="n">${p.n}</span></button>`).join('')}</div>
    ${r.actividad.length ? `<div class="tabla"><table><tr><th>Cuándo</th><th>Quién</th><th>Qué</th></tr>${r.actividad.map((x) => `<tr><td>${hora(x.at)}</td><td>${esc(x.quien)}</td><td>${esc(x.accion)}</td></tr>`).join('')}</table></div>` : '<div class="vacio">Todavía no hay cambios registrados.</div>'}`;
  $('#main').querySelectorAll('[data-q]').forEach((b) => b.onclick = () => { estado.actQuien = b.dataset.q || null; actividadPagina(); });

// ---------- Estadísticas y consumo ----------
async function estadisticas() {
  const f = estado.est ||= { dias: 30, sede: '', canal: '' };
  $('#main').innerHTML = `<h2>Estadísticas</h2><div class="filtros">${[[7, '7 días'], [30, '30 días'], [90, '90 días']].map(([d, t]) => `<button data-ed="${d}" class="${f.dias === d ? 'activo' : ''}">${t}</button>`).join('')}
    <select id="esede" aria-label="Sede"><option value="">Todas las sedes</option>${[...Object.entries(SEDES), ['sin_sede', 'Sin sede']].map(([k, t]) => `<option value="${k}" ${f.sede === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <select id="ecanal" aria-label="Canal"><option value="">WhatsApp e Instagram</option>${Object.entries(CANAL).map(([k, t]) => `<option value="${k}" ${f.canal === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div><div id="est" class="vacio">Cargando…</div>`;
  $('#main').querySelectorAll('[data-ed]').forEach((b) => b.onclick = () => { f.dias = Number(b.dataset.ed); estadisticas(); });
  $('#esede').onchange = (e) => { f.sede = e.target.value; estadisticas(); };
  $('#ecanal').onchange = (e) => { f.canal = e.target.value; estadisticas(); };
  const [e, c] = await Promise.all([api(`/panel/estadisticas?dias=${f.dias}&sede=${f.sede}&canal=${f.canal}`), api('/panel/consumo?meses=6')]);
  if (estado.seccion !== 'estadisticas' || !$('#est')) return;
  const maxDia = Math.max(1, ...e.porDia.map((d) => (d.whatsapp || 0) + (d.instagram || 0)));
  const maxMapa = Math.max(1, ...e.mapa.flat());
  const pct = (a, b) => (b ? `${Math.round((a / b) * 100)} %` : '–');
  const tablaGrupo = (t, filas, nombre) => `<h3>${t}</h3><div class="tabla"><table><tr><th></th><th>Chats</th><th>Clase de prueba</th><th>Alta</th><th>Derivados</th><th>Lo dejan para más adelante</th></tr>${filas.map((g) => `<tr><td>${esc(nombre(g.grupo))}</td><td>${g.chats}</td><td>${g.prueba} <span class="ayuda">${pct(g.prueba, g.chats)}</span></td><td>${g.alta} <span class="ayuda">${pct(g.alta, g.chats)}</span></td><td>${g.derivados}</td><td>${g.mas_adelante}</td></tr>`).join('') || '<tr><td colspan="6" class="vacio">Sin datos</td></tr>'}</table></div>`;
  const eur = (n) => (n < 0.01 && n > 0 ? '< 0,01 €' : `${n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`);
  $('#est').outerHTML = `
    <div class="tarjetas">${tarjeta(e.total, 'Chats nuevos de leads')}${e.embudo.slice(1).map(([t, n]) => tarjeta(n, `${t} · ${pct(n, e.total)}`)).join('')}</div>
    <h3>Chats nuevos por día <span class="chip">WhatsApp</span> <span class="chip violeta">Instagram</span></h3>
    ${e.porDia.length ? `<div class="barras">${e.porDia.map((d) => `<div title="${d.fecha}: ${d.whatsapp || 0} WhatsApp · ${d.instagram || 0} Instagram"><i style="height:${(d.instagram || 0) / maxDia * 70}px;background:var(--violet)"></i><i style="height:${(d.whatsapp || 0) / maxDia * 70}px;background:var(--green)"></i></div>`).join('')}</div>` : '<div class="vacio">Sin chats en este periodo</div>'}
    <h3>Cuándo entran los chats <span class="ayuda">día de la semana × hora (Madrid)</span></h3>
    <div class="mapa" role="table">${'<div></div>' + Array.from({ length: 24 }, (_, h) => `<div class="mh">${h % 3 === 0 ? h : ''}</div>`).join('')}
      ${e.mapa.map((fila, d) => `<div class="md">${DIAS_TXT[d][1].slice(0, 3)}</div>` + fila.map((n, h) => `<div class="mc" style="--a:${n / maxMapa}" title="${DIAS_TXT[d][1]} ${h}:00 · ${n} chat${n === 1 ? '' : 's'}">${n || ''}</div>`).join('')).join('')}</div>
    <h3>Embudo</h3><div class="embudo-h">${e.embudo.map(([t, n], k) => `<div class="eh"><span>${esc(t)}</span><div class="eh-barra"><i style="width:${e.total ? (n / e.total) * 100 : 0}%"></i></div><b>${n}</b><span class="ayuda">${k ? pct(n, e.embudo[k - 1][1]) + ' del paso anterior' : ''}</span></div>`).join('')}</div>
    ${tablaGrupo('Por canal', e.porCanal, (g) => CANAL[g] || g)}
    ${tablaGrupo('Por sede', e.porSede, (g) => SEDES[g] || (g === 'sin_sede' ? 'Sin sede' : g))}
    <h3>Etiquetas más puestas</h3><div class="chips-f">${e.etiquetas.map((x) => `${pill(x)} <span class="ayuda">${x.n}</span>`).join(' ') || '<span class="ayuda">Ninguna en este periodo</span>'}</div>
    <h3>Consumo de la IA <span class="ayuda">aproximado, a ${c.eurPorUsd} € por dólar (la API cobra en dólares)</span></h3>
    ${c.meses.length ? `<div class="tabla"><table><tr><th>Mes</th><th>Total</th><th>Por chat nuevo</th><th>En qué</th></tr>${c.meses.map((m) => `<tr><td>${new Date(m.mes + '-15').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}</td><td><b>${eur(m.eur)}</b><div class="ayuda">${m.llamadas} llamadas · $${m.usd.toFixed(2)}</div></td><td>${m.eurPorChat != null ? eur(m.eurPorChat) : '–'}<div class="ayuda">${m.chats} chats</div></td><td>${m.motivos.map((x) => `${esc(x.motivo)}: ${eur(x.eur)}`).join('<br>')}</td></tr>`).join('')}</table></div>` : '<div class="vacio">Sin consumo todavía</div>'}
    <p class="ayuda">Las notas de voz se transcriben en el propio servidor: no cuestan nada aparte.</p>`;
}

// ---------- Recursos ----------
async function recursos() {
  const lista = await api('/panel/recursos');
  if (estado.seccion !== 'recursos') return;
  const vista = (r) => r.tipo === 'imagen' ? `<img class="rec-img" alt="" data-media="/panel/recursos/${r.id}/archivo">` : r.tipo === 'video' ? `<video class="rec-img" controls preload="none" data-media="/panel/recursos/${r.id}/archivo"></video>` : `<div class="rec-doc">${r.tipo === 'audio' ? '🎵' : '📄'} ${esc(r.mime || '')}</div>`;
  $('#main').innerHTML = `<div class="cab-seccion"><h2>Recursos</h2><button class="primario" id="rnuevo">+ Subir recurso</button></div>
    <p class="intro">Archivos que Sofía puede enviar cuando encajan en la conversación (horarios en PDF, fotos del box, un vídeo, cómo llegar…). Lee el nombre y «cuándo enviarlo» para decidir. Un seguimiento también puede adjuntar uno. En modo prueba no se envían: queda el borrador.</p>
    <div id="rform"></div>
    ${lista.length ? `<div class="rec-grid">${lista.map((r) => `<article class="rec ${r.activo ? '' : 'inactiva'}">${vista(r)}<div class="rec-body"><b>${esc(r.nombre)}</b> <span class="chip">${esc(r.tipo)}</span>${r.activo ? '' : ' <span class="chip ambar">no se envía</span>'}
      <p class="ayuda">Cuándo: ${esc(r.descripcion)}</p><p class="ayuda">${(r.tamano / 1024 / 1024).toFixed(1)} MB</p>
      <div class="acciones-f"><button class="mini" data-red="${r.id}">Editar</button><button class="mini" data-ract="${r.id}" data-on="${r.activo ? 0 : 1}">${r.activo ? 'Desactivar' : 'Activar'}</button><button class="mini peligro" data-rbor="${r.id}">Borrar</button></div></div></article>`).join('')}</div>` : '<div class="vacio">Todavía no hay recursos. Sube por ejemplo el horario de cada sede en imagen o PDF.</div>'}`;
  cargarMedios($('#main'));
  const form = (r) => {
    $('#rform').innerHTML = `<form class="editor" id="frec"><section><h3>${r ? `Editar «${esc(r.nombre)}»` : 'Subir recurso'}</h3>
      <input name="n" placeholder="Nombre. Ej: Horario Parla" maxlength="60" value="${esc(r?.nombre || '')}" style="width:100%;margin-bottom:8px" required>
      <textarea name="d" rows="2" maxlength="500" placeholder="Cuándo enviarlo. Ej: cuando pregunte por horarios de Parla" required style="width:100%">${esc(r?.descripcion || '')}</textarea>
      ${r ? '' : '<p><input type="file" name="f" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,application/pdf,audio/*" required></p><p class="ayuda">Imagen, vídeo MP4, PDF o audio. Máximo 25 MB.</p>'}
      <div class="acciones-f"><button class="primario">${r ? 'Guardar' : 'Subir'}</button><button type="button" id="rcanc">Cancelar</button></div><p class="error"></p></section></form>`;
    $('#rcanc').onclick = () => { $('#rform').innerHTML = ''; };
    $('#frec').onsubmit = async (e) => {
      e.preventDefault(); const f = e.target; const b = f.querySelector('.primario'); b.disabled = true; b.textContent = r ? 'Guardando…' : 'Subiendo…';
      try {
        if (r) await api(`/panel/recursos/${r.id}`, { method: 'PUT', body: JSON.stringify({ nombre: f.n.value, descripcion: f.d.value }) });
        else {
          const file = f.f.files[0]; if (file.size > 25 * 1024 * 1024) throw new Error('Como mucho 25 MB.');
          const datos = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.readAsDataURL(file); });
          await api('/panel/recursos/adjunto', { method: 'POST', body: JSON.stringify({ nombre: f.n.value, descripcion: f.d.value, datos, mime: file.type, archivo: file.name }) });
        }
        recursos();
      } catch (err) { f.querySelector('.error').textContent = err.message; b.disabled = false; b.textContent = r ? 'Guardar' : 'Subir'; }
    };
  };
  $('#rnuevo').onclick = () => form(null);
  $('#main').querySelectorAll('[data-red]').forEach((b) => b.onclick = () => form(lista.find((x) => x.id === Number(b.dataset.red))));
  $('#main').querySelectorAll('[data-ract]').forEach((b) => b.onclick = async () => { await api(`/panel/recursos/${b.dataset.ract}`, { method: 'PUT', body: JSON.stringify({ activo: b.dataset.on === '1' }) }); recursos(); });
  $('#main').querySelectorAll('[data-rbor]').forEach((b) => b.onclick = async () => { if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Seguro?'; return; } await api(`/panel/recursos/${b.dataset.rbor}`, { method: 'DELETE' }); recursos(); });
}

integrado || token ? iniciar() : pintarLogin();
