<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAPP · Panel de Sofía</title>
<!-- metrotools-assets -->
<style>
  :root {
    --bg: var(--m4-canvas, #f4f6f3); --panel: var(--m4-panel, #fff); --panel2: #f0f4ed;
    --line: var(--m4-line, #dce3da); --text: var(--m4-ink, #1d2b22); --muted: var(--m4-muted, #5f6d64);
    --green: var(--m4-green, #386b36); --amber: #805003; --red: #a13030; --blue: #2f5a77; --violet: #6a4882; --radius: 9px;
  }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  #raiz, #raiz * { box-sizing: border-box; }
  #raiz button, #raiz input, #raiz select { font: inherit; color: inherit; }
  #raiz :focus-visible { outline: 3px solid #77a552; outline-offset: 3px; }
  #raiz button, .secciones a { min-height: 42px; border: 1px solid #becdb8; background: var(--panel2); color: #294f2a; border-radius: 7px; padding: 8px 14px; font-weight: 600; }
  #raiz button { cursor: pointer; }
  #raiz button:hover, .secciones a:hover { border-color: var(--green); }
  #raiz button:disabled, #raiz input:disabled { opacity: .55; cursor: default; }
  #raiz button.primario, #raiz .filtros button.activo, .secciones a[aria-current="page"] { background: var(--green); border-color: var(--green); color: #fff; }
  #raiz button.peligro { border-color: #d9b8b8; color: var(--red); background: #fff; }
  #raiz input:not([type="checkbox"]), #raiz select { min-height: 42px; max-width: 100%; background: var(--panel); border: 1px solid #becdb8; border-radius: 7px; padding: 7px 10px; }
  .sofia { max-width: 1280px; margin: auto; padding: 32px clamp(16px, 3vw, 40px) 24px; }
  .sofia-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .sofia-cabecera h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.7px; margin: 0; }
  .modo { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .secciones { display: flex; gap: 6px; overflow-x: auto; padding: 4px; margin: -4px -4px 20px; }
  .secciones a { display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; text-decoration: none; }
  #main { min-width: 0; }
  #main h2 { font-size: 19px; margin: 24px 0 10px; line-height: 1.3; }
  #main > h2:first-child { margin-top: 0; }
  .sofia h3 { font-size: 16px; margin: 22px 0 10px; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tarjeta { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .tarjeta .n { font-size: 26px; font-weight: 700; }
  .tarjeta .l { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.verde { color: var(--green); border-color: #2fbf7155; } .chip.ambar { color: var(--amber); border-color: #d1ad7166; }
  .chip.rojo { color: var(--red); border-color: #e05a4f55; } .chip.azul { color: var(--blue); border-color: #4ea1e055; } .chip.violeta { color: var(--violet); border-color: #9d7be055; }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chats { display: grid; grid-template-columns: minmax(235px, 33%) minmax(0, 1fr); gap: 14px; height: max(400px, calc(100dvh - 350px)); }
  .lista { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  #raiz .item { display: block; width: 100%; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); text-align: left; background: var(--panel); padding: 11px 13px; }
  #raiz .item:hover, #raiz .item.activo { background: var(--panel2); }
  .item .fila { display: flex; justify-content: space-between; gap: 8px; }
  .item .nom { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .ult { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 2px 0 5px; }
  .item .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .hilo { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
  .hilo .cab { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hilo .msgs { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .burbuja { max-width: 75%; padding: 7px 11px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .burbuja .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .b-lead { align-self: flex-start; background: var(--panel2); }
  .b-ia { align-self: flex-end; background: #e4f1df; }
  .b-ia.borrador { background: transparent; border: 1px dashed #2fbf7188; }
  .b-humano { align-self: flex-end; background: #e7eff5; }
  .b-sistema { align-self: center; background: transparent; color: var(--muted); font-size: 12px; }
  .hilo .pie { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12px; color: var(--muted); max-height: 180px; overflow: auto; }
  .tabla { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .vacio { color: var(--muted); padding: 30px; text-align: center; }
  .ajuste { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; }
  .ajuste .t { font-weight: 600; } .ajuste .d { color: var(--muted); font-size: 13px; }
  .interruptor { position: relative; width: 44px; height: 24px; flex: none; }
  .interruptor input { opacity: 0; width: 0; height: 0; }
  .interruptor input:focus-visible + span { outline: 3px solid #77a552; outline-offset: 3px; }
  .interruptor span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .15s; }
  .interruptor span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .interruptor input:checked + span { background: var(--green); }
  .interruptor input:checked + span::after { transform: translateX(20px); }
  .regla { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; }
  .regla .cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .regla p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .barras { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .barras div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; align-items: stretch; }
  .barras i { display: block; border-radius: 3px 3px 0 0; }
  .probar { display: grid; grid-template-rows: 1fr auto; height: max(320px, calc(100dvh - 365px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .probar form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .probar form input { flex: 1; min-width: 0; }
  .aviso { background: #fdf6e7; border: 1px solid #d1ad7166; color: var(--amber); padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
  .error { color: var(--red); }
  .login { max-width: 340px; margin: 18vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: grid; gap: 12px; }
  .volver { display: none; }
  html[data-metro-ui="4"] .m4-center-slot { display: none; }
  @media (max-width: 1040px) {
    .chats { grid-template-columns: minmax(0, 1fr); height: auto; }
    .chats.con-hilo .lista, .chats:not(.con-hilo) .hilo { display: none; }
    .hilo { height: max(330px, calc(100dvh - 335px)); }
    .volver { display: inline-block; }
    .burbuja { max-width: 88%; }
  }
  @media (max-width: 540px) {
    .sofia { padding-top: 20px; }
    .sofia-cabecera h1 { font-size: 24px; }
    .secciones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; }
    .secciones a { justify-content: center; padding-inline: 4px; }
    .tarjetas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tarjeta { padding: 11px; }
    .probar form { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
    .probar form input { grid-row: 2; }
    .probar form button.primario { grid-area: 2 / 2; }
    .ajuste:has(input[type="number"]) { flex-wrap: wrap; }
  }
  .embudos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .embudo { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .embudo h3 { margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .embudo h3 .chip { font-weight: 600; }
  .paso { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 10px; margin-bottom: 8px; }
  .paso .et { font-size: 12px; color: var(--muted); line-height: 1.25; }
  .paso .pista { display: flex; justify-content: center; }
  .paso .barra { min-width: 42px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; transition: width .3s; }
  .paso .barra.cero { background: transparent !important; color: var(--muted); border: 1px dashed var(--line); }
  .paso .tasa { grid-column: 2; text-align: center; font-size: 11px; color: var(--muted); margin: -4px 0 2px; }
  .mes { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .mes b { min-width: 130px; text-align: center; }
  .nota { color: var(--muted); font-size: 12px; margin-top: 12px; }
  /* Vistas y filtros */
  .vistas { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 0 8px; margin-bottom: 4px; }
  #raiz .vistas button { white-space: nowrap; min-height: 36px; padding: 5px 11px; font-size: 13px; }
  #raiz .vistas button.propia { border-color: #9fbf8f; }
  #raiz .vistas button.activo { background: var(--green); border-color: var(--green); color: #fff; }
  .n { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 99px; background: #0000000f; font-size: 12px; text-align: center; }
  .activo .n { background: #ffffff33; }
  #raiz button.suave { background: transparent; border-style: dashed; }
  .barra-filtros { display: flex; gap: 8px; margin-bottom: 10px; }
  .barra-filtros input { flex: 1; min-width: 0; }
  .panel-filtros { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 10px; }
  .panel-filtros fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .panel-filtros legend { font-weight: 600; font-size: 13px; margin-bottom: 6px; padding: 0; }
  .chips-f { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #raiz .ch { min-height: 34px; padding: 4px 11px; border-radius: 99px; font-weight: 500; background: var(--panel); font-size: 13px; }
  #raiz .ch.on { background: var(--green); color: #fff; border-color: var(--green); }
  #raiz .ch.etq-f { border-color: color-mix(in srgb, var(--c) 45%, transparent); color: var(--c); }
  #raiz .ch.etq-f.on { background: var(--c); color: #fff; border-color: var(--c); }
  #raiz .ch.etq-f.no { background: #fff; color: var(--red); border-color: var(--red); text-decoration: line-through; }
  .modo-etq { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .fila-f { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .fila-f label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
  .acciones-f { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .guardar-vista { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .activos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  #raiz .activo-f { min-height: 30px; padding: 3px 10px; border-radius: 99px; font-size: 12px; background: #e4f1df; border-color: #b9d4af; }
  #raiz .activo-f.limpiar { background: transparent; }
  .ayuda { color: var(--muted); font-size: 12px; font-weight: 400; }
  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); margin-right: 5px; vertical-align: middle; }
  /* Etiquetas */
  .etq { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, #fff); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .etq-hilo { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .p-analisis .etq-hilo { padding: 0; border: 0; }
  .etq-q { display: inline-flex; align-items: center; }
  #raiz button.x { min-height: 28px; min-width: 28px; padding: 0 6px; border: 0; background: transparent; color: var(--muted); font-weight: 400; }
  #raiz button.x:hover { color: var(--red); }
  .etq-hilo select { min-height: 32px; padding: 3px 8px; font-size: 13px; }
  .cab-seccion { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .cab-seccion h2 { margin: 0 !important; }
  .intro { color: var(--muted); max-width: 820px; margin: 0 0 16px; }
  .etq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
  .etq-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; align-content: start; }
  .etq-card.inactiva { opacity: .65; }
  .etq-card header { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .etq-card .etq { font-size: 13px; padding: 3px 10px; }
  .etq-card p, .etq-card ul { margin: 0; font-size: 13px; }
  .etq-card ul { padding-left: 18px; }
  .criterio { color: var(--violet); }
  .acc { display: flex; gap: 4px; flex-wrap: wrap; }
  .etq-card footer { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .etq-card footer a { color: var(--green); font-weight: 600; font-size: 13px; margin-left: auto; }
  #raiz .etq-card footer button { min-height: 36px; padding: 5px 11px; font-size: 13px; }
  .editor { display: grid; gap: 14px; max-width: 860px; }
  .editor section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .editor h3 { margin: 0 0 10px !important; }
  .editor h4 { margin: 14px 0 8px; font-size: 14px; }
  .editor textarea, .p-form textarea { width: 100%; font: inherit; border: 1px solid #becdb8; border-radius: 7px; padding: 8px 10px; background: var(--panel); color: inherit; resize: vertical; }
  .editor #enom { flex: 1; min-width: 200px; }
  .colores { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #raiz .colores button { width: 34px; min-height: 34px; height: 34px; padding: 0; border-radius: 50%; border: 3px solid transparent; }
  #raiz .colores button.on { border-color: var(--text); box-shadow: inset 0 0 0 2px #fff; }
  .check { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; cursor: pointer; flex-wrap: wrap; }
  .check input { accent-color: var(--green); width: 17px; height: 17px; }
  .regla-f { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: var(--panel2); border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
  .regla-f input:not([type="number"]) { flex: 1; min-width: 140px; }
  .anadir-regla { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
  #raiz .anadir-regla button { min-height: 34px; padding: 4px 10px; font-size: 13px; }
  .importar { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; display: grid; gap: 10px; }
  .importar h3 { margin: 0 !important; }
  .lista-imp { max-height: 260px; overflow: auto; }
  .lista-imp label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .cond { margin-bottom: 10px; } .cond b { display: block; font-size: 13px; margin-bottom: 6px; }
  /* Probar IA */
  .probar2 { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 12px; height: max(460px, calc(100dvh - 260px)); }
  .probar2 > * { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-height: 0; overflow: auto; }
  .p-lista { display: flex; flex-direction: column; }
  .p-nueva { display: grid; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  #plista { flex: 1; overflow: auto; }
  .p-item { display: flex; border-bottom: 1px solid var(--line); }
  .p-item.activo { background: var(--panel2); }
  #raiz .p-abrir { flex: 1; min-width: 0; display: grid; gap: 2px; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 10px 6px 10px 12px; font-weight: 400; }

  .p-abrir .ult { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #raiz .peligro-t { margin: 8px; color: var(--red); }

  .p-chat .cab { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }

  .p-analisis h3 { margin: 0 0 8px !important; }
  .p-analisis section { border-top: 1px solid var(--line); padding: 9px 0; }
  .p-analisis h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .p-analisis p { margin: 4px 0; }
  .p-analisis .chips { display: flex; gap: 4px; flex-wrap: wrap; }

  .herr summary { cursor: pointer; }
  .fu li { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  #raiz .fu button { min-height: 32px; padding: 3px 10px; font-size: 12px; }
  .aviso-mini { background: #fdf6e7; color: var(--amber); padding: 6px 8px; border-radius: 6px; }
  #raiz .aviso-mini button { min-height: 30px; padding: 2px 8px; font-size: 12px; margin-left: 4px; }

    .probar2 { grid-template-columns: minmax(0, 1fr); }
    .probar2.con-prueba .p-lista, .probar2:not(.con-prueba) .p-chat, .probar2:not(.con-prueba) .p-analisis { display: none; }
    .guardar-vista { margin-left: 0; }
    .p-chat { height: calc(100dvh - 220px); }
  }
  @media (min-width: 761px) { #pvolver { display: none; } }
  @media (max-width: 760px) { #pmovil { display: none; } }
</style>
</head>
<body>
<div id="raiz" class="sofia"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SEDES = { parla: 'Parla', getafe: 'Getafe', las_rosas: 'Las Rosas', el_canaveral: 'El Cañaveral' };
const CANAL = { whatsapp: 'WhatsApp', instagram: 'Instagram' };
const hora = (iso) => { if (!iso) return ''; const d = new Date(/Z$|T/.test(iso) ? iso : iso.replace(' ', 'T') + 'Z'); const hoy = new Date();
  return d.toDateString() === hoy.toDateString() ? d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); };
const minutos = (m) => m >= 1440 ? `${+(m / 1440).toFixed(1)} días` : m >= 60 ? `${+(m / 60).toFixed(1)} h` : `${m} min`;
const miles = (n) => Number(n || 0).toLocaleString('es-ES');

const integrado = location.pathname === '/zapp/';
if (integrado) {
  const menu = document.createElement('div');
  menu.dataset.metroPlatform = '';
  menu.dataset.title = 'ZAPP · Sofía';
  document.body.prepend(menu);
}
let token = '';
if (!integrado) try { token = localStorage.getItem('sofia_panel') || ''; } catch {}
const estado = { seccion: location.hash.slice(1).split('/')[0] || 'resumen', filtro: 'todos', q: '', conv: null, dias: 1, info: null, prueba: { sesion: 'panel-' + Math.random().toString(36).slice(2, 7), mensajes: [] } };

async function api(ruta, opciones = {}) {
  const cabecera = integrado ? { 'x-metrotools-client': 'zapp' } : { authorization: 'Bearer ' + token };
  const r = await fetch((integrado ? './api' : '/admin') + ruta, {
    ...opciones, cache: 'no-store', headers: { ...cabecera, 'content-type': 'application/json' },
  });
  if (integrado && r.redirected && new URL(r.url).pathname === '/access-admin/login') {
    location.assign('/access-admin/login?next=' + encodeURIComponent(location.href));
    throw new Error('La sesión de MetroTools ha caducado.');
  }
  if (!integrado && r.status === 401) { salir(); throw new Error('Clave incorrecta.'); }
  const j = r.headers.get('content-type')?.includes('application/json') ? await r.json() : {};
  if (!r.ok) throw new Error(j.error || 'No se ha podido completar la petición.');
  return j;
}

function salir() { token = ''; estado.info = null; try { localStorage.removeItem('sofia_panel'); } catch {} pintarLogin(); }

function pintarLogin(error = '') {
  $('#raiz').innerHTML = `<form class="login" id="fl"><b>Panel de Sofía</b><span style="color:var(--muted);font-size:13px">Clave de administración (ADMIN_TOKEN del servidor)</span>
    <input type="password" id="tk" aria-label="Clave de administración" autocomplete="current-password" autofocus><button class="primario">Entrar</button><span class="error">${esc(error)}</span></form>`;
  $('#fl').onsubmit = async (e) => {
    e.preventDefault(); token = $('#tk').value.trim();
    try { await api('/panel/estado'); try { localStorage.setItem('sofia_panel', token); } catch {} iniciar(); } catch { pintarLogin('Clave incorrecta'); }
  };
}

const SECCIONES = [['resumen', 'Resumen'], ['embudo', 'Embudo'], ['chats', 'Chats'], ['etiquetas', 'Etiquetas'], ['altas', 'Altas'], ['seguimientos', 'Seguimientos'], ['probar', 'Probar IA'], ['ajustes', 'Ajustes']];

async function iniciar() {
  estado.seccion = location.hash.slice(1).split('/')[0] || 'resumen';
  $('#raiz').innerHTML = '<main id="main" tabindex="-1"><div class="vacio" role="status">Cargando ZAPP…</div></main>';
  try {
    estado.info = await api('/panel/estado');
  } catch (e) {
    if (integrado) $('#main').innerHTML = `<p class="aviso" role="alert">${esc(e.message)}</p><button id="reintentar">Volver a intentar</button>`;
    $('#reintentar')?.addEventListener('click', iniciar);
    return;
  }
  const i = estado.info;
  $('#raiz').innerHTML = `<header class="sofia-cabecera">
    <h1>ZAPP · Sofía</h1>
    <div class="modo">${i.modo === 'live' ? '<span class="chip verde">Modo real</span>' : '<span class="chip ambar">Modo prueba</span>'}
      ${i.ajustes.ia_activa ? '' : '<span class="chip rojo">IA pausada</span>'}
      ${integrado ? '' : '<button id="bsalir">Salir</button>'}</div>
    </header>
    <nav class="secciones" aria-label="Secciones de ZAPP">
      ${SECCIONES.map(([id, t]) => `<a href="#${id}" data-s="${id}">${t}${id === 'chats' && i.contadores.todos ? ` <span>${i.contadores.todos}</span>` : ''}</a>`).join('')}
    </nav><main id="main" tabindex="-1"></main>`;
  $('#bsalir')?.addEventListener('click', salir);
  pintar();
}

window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1).split('/')[0];
  if (!estado.info || (id && !SECCIONES.some(([seccion]) => seccion === id))) return;
  if (id !== 'etiquetas') estado.editEtq = null;
  estado.seccion = id || 'resumen';
  pintar();
});

async function pintar() {
  const seccion = estado.seccion;
  document.querySelectorAll('.secciones a').forEach((a) => {
    if (a.dataset.s === seccion) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  try {
    await (({ resumen, embudo, chats, etiquetas, altas, seguimientos, probar, ajustes })[seccion] || resumen)();
  } catch (e) {
    if (estado.info && estado.seccion === seccion) {
      $('#main').innerHTML = `<p class="aviso" role="alert">${esc(e.message)}</p><button id="reintentar">Volver a intentar</button>`;
      $('#reintentar').onclick = pintar;
    }
  }
}

const PASOS = [['leads', 'Leads nuevos', '#9fbf8f'], ['reservan', 'Reservan prueba', '#6f9e5e'], ['asisten', 'Asisten', '#4f8344'], ['pagan', 'Primer pago', '#2f5f2c']];
const mesMas = (mes, d) => { const [a, m] = mes.split('-').map(Number); const f = new Date(Date.UTC(a, m - 1 + d, 1)); return f.toISOString().slice(0, 7); };
const nombreMes = (mes) => { const t = new Date(mes + '-15T12:00:00Z').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); return t[0].toUpperCase() + t.slice(1); };
const pct = (a, b) => (b ? Math.round((a / b) * 100) + ' %' : '–');

async function embudo() {
  const hoy = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit' }).format(new Date());
  estado.mes ||= hoy;
  const m = $('#main');
  m.innerHTML = `<h2>Embudo por sede</h2>
    <div class="mes"><button id="mprev" aria-label="Mes anterior">‹</button><b>${esc(nombreMes(estado.mes))}</b>
      <button id="mnext" aria-label="Mes siguiente" ${estado.mes >= hoy ? 'disabled' : ''}>›</button></div>
    <div id="emb" class="vacio" role="status">Cargando…</div>`;
  $('#mprev').onclick = () => { estado.mes = mesMas(estado.mes, -1); embudo(); };
  $('#mnext').onclick = () => { estado.mes = mesMas(estado.mes, 1); embudo(); };
  const pedido = estado.mes;
  const r = await api('/panel/embudo?mes=' + pedido);
  if (estado.seccion !== 'embudo' || estado.mes !== pedido || !$('#emb')) return;
  const tot = PASOS.map(([k]) => r.sedes.reduce((s, x) => s + (x[k] || 0), 0));
  const tarjetaSede = (titulo, valores) => {
    const base = Math.max(1, valores[0] || 0, ...valores.map((v) => v || 0));
    return `<div class="embudo"><h3>${esc(titulo)} <span class="chip verde">${pct(valores[3] || 0, valores[0] || 0)} conversión</span></h3>
      ${PASOS.map(([, et, color], i) => {
        const v = valores[i];
        const ancho = v ? Math.max(14, (v / base) * 100) : 0;
        return `${i ? `<div class="paso"><div class="tasa">↓ ${pct(v || 0, valores[i - 1] || 0)}</div></div>` : ''}
        <div class="paso"><div class="et">${et}</div><div class="pista">
          <div class="barra ${v ? '' : 'cero'}" style="width:${v ? ancho + '%' : '42px'};background:${color}" title="${et}: ${v ?? 'sin datos'}">${v ?? '–'}</div></div></div>`;
      }).join('')}</div>`;
  };
  $('#emb').outerHTML = `
    ${r.avisos.map((a) => `<div class="aviso">${esc(a)}</div>`).join('')}
    <div class="embudos">
      ${r.sedes.map((x) => tarjetaSede(SEDES[x.sede] || x.sede, PASOS.map(([k]) => x[k]))).join('')}
      ${tarjetaSede('Total 3 sedes', tot)}
    </div>
    <p class="nota">Leads nuevos: contactos creados en GHL este mes con etiqueta de sede (sin contar socios)${r.sin_sede ? ` · <b>${r.sin_sede}</b> leads más no tienen sede asignada` : ''}.
    Reservas, asistencias y primer pago: pruebas del mes en AimHarder${r.pruebas_actualizadas ? `, datos del ${new Date(r.pruebas_actualizadas).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })}` : ''}.
    Primer pago = alta pagada después de la clase de prueba.</p>`;
}

// ---------- Chats: vistas y filtros ----------
const ESTADO_TXT = { ia_activa: 'IA activa', pausadas: 'Pausadas', derivadas: 'Derivadas', seguimiento: 'Con follow-up', prueba: 'Clase prueba', alta: 'Alta', socios: 'Socios', leads: 'Leads (no socios)' };
const FASES = ['f1 apertura', 'f2 diagnóstico', 'f3 presentación', 'f4 objeciones', 'f5 cierre', 'cerrada'];
const vacios = (c) => !Object.keys(c || {}).filter((k) => k !== 'modo').length;
const pill = (e, extra = '') => `<span class="etq" style="--c:${esc(e.color)}" title="${esc(e.nombre)}${e.origen ? ' · puesta ' + ({ manual: 'a mano', regla: 'por regla', ia: 'por Sofía', ghl: 'desde GHL' }[e.origen] || e.origen) : ''}">${e.origen === 'ia' ? '✨ ' : ''}${esc(e.nombre)}${extra}</span>`;

async function cargarOpciones() { estado.opciones = await api('/panel/opciones'); return estado.opciones; }

function resumenCriterios(c, opciones) {
  const etqN = (id) => opciones.etiquetas.find((e) => e.id === id);
  const out = [];
  for (const e of c.estado || []) out.push(['estado', e, ESTADO_TXT[e] || e]);
  for (const id of c.etiquetas || []) { const e = etqN(id); if (e) out.push(['etiquetas', id, `${c.modo === 'todas' ? 'Lleva' : 'Lleva'} «${e.nombre}»`]); }
  for (const id of c.sin_etiquetas || []) { const e = etqN(id); if (e) out.push(['sin_etiquetas', id, `Sin «${e.nombre}»`]); }
  if (c.sin_ninguna) out.push(['sin_ninguna', true, 'Sin etiquetas']);
  for (const s of c.sede || []) out.push(['sede', s, s === 'sin_sede' ? 'Sin sede' : SEDES[s] || s]);
  for (const s of c.canal || []) out.push(['canal', s, CANAL[s] || s]);
  for (const s of c.fase || []) out.push(['fase', s, s === 'sin_fase' ? 'Sin fase' : s]);
  if (c.actividad) out.push(['actividad', c.actividad, c.actividad === 1 ? 'Activos hoy' : `Activos ${c.actividad} días`]);
  if (c.espera) out.push(['espera', c.espera, c.espera === 'equipo' ? 'Esperan nuestra respuesta' : 'Esperamos al lead']);
  return out;
}

function quitarCriterio(c, clave, valor) {
  const n = { ...c };
  if (Array.isArray(n[clave])) { n[clave] = n[clave].filter((x) => x !== valor); if (!n[clave].length) delete n[clave]; } else delete n[clave];
  if ((n.etiquetas || []).length < 2) delete n.modo;
  return n;
}

async function chats() {
  const [vistas, opciones] = await Promise.all([api('/panel/vistas'), cargarOpciones()]);
  if (estado.seccion !== 'chats') return;
  estado.vistas = vistas;
  if (!estado.vista || !vistas.some((v) => String(v.id) === String(estado.vista))) { estado.vista = 'todos'; estado.crit = {}; }
  estado.crit ??= { ...(vistas.find((v) => String(v.id) === String(estado.vista))?.criterios || {}) };
  $('#main').innerHTML = `<h2>Chats</h2>
    <div class="vistas" role="tablist" aria-label="Vistas de chats">${vistas.map((v) => `<button role="tab" data-v="${esc(v.id)}" aria-selected="${String(v.id) === String(estado.vista)}" class="${String(v.id) === String(estado.vista) ? 'activo' : ''} ${v.propia ? 'propia' : ''}" title="${v.propia ? 'Vista creada por vosotros' : 'Vista del sistema'}">${v.propia ? '★ ' : ''}${esc(v.nombre)} <span class="n">${v.total}</span></button>`).join('')}
      <button id="vnueva" class="suave" title="Crear una vista con los filtros que elijas">+ Vista</button></div>
    <div class="barra-filtros">
      <input id="q" type="search" aria-label="Buscar chat o mensaje" placeholder="Buscar nombre, teléfono o mensaje" value="${esc(estado.q)}">
      <button id="bfil" aria-expanded="${Boolean(estado.panelFiltros)}" aria-controls="pfil">Filtros${resumenCriterios(estado.crit, opciones).length ? ` <span class="n">${resumenCriterios(estado.crit, opciones).length}</span>` : ''}</button>
    </div>
    <div id="pfil" class="panel-filtros" ${estado.panelFiltros ? '' : 'hidden'}></div>
    <div id="activos" class="activos"></div>
    <div class="chats ${estado.conv ? 'con-hilo' : ''}" id="ch"><div class="lista" id="lista"><div class="vacio">Cargando…</div></div><div class="hilo" id="hilo"><div class="vacio">Elige un chat</div></div></div>`;
  $('#main').querySelectorAll('[data-v]').forEach((b) => b.onclick = () => {
    estado.vista = b.dataset.v; estado.crit = { ...(vistas.find((v) => String(v.id) === b.dataset.v)?.criterios || {}) }; estado.conv = null; chats();
  });
  $('#vnueva').onclick = () => { estado.vista = 'todos'; estado.crit = {}; estado.panelFiltros = true; estado.creandoVista = true; chats(); };
  $('#bfil').onclick = () => { estado.panelFiltros = !estado.panelFiltros; $('#pfil').hidden = !estado.panelFiltros; $('#bfil').setAttribute('aria-expanded', estado.panelFiltros); };
  let t; $('#q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { estado.q = e.target.value; lista(); }, 300); };
  pintarFiltros();
  await lista();
  if (estado.seccion === 'chats' && estado.conv) await abrir(estado.conv);
}

function pintarFiltros() {
  const c = estado.crit; const o = estado.opciones;
  const vista = estado.vistas.find((v) => String(v.id) === String(estado.vista));
  const cambiado = JSON.stringify(normalizar(c)) !== JSON.stringify(normalizar(vista?.criterios || {}));
  const chip = (clave, valor, texto, activo, extra = '') => `<button type="button" class="ch ${activo ? 'on' : ''}" aria-pressed="${activo}" data-k="${clave}" data-val="${esc(valor)}" ${extra}>${texto}</button>`;
  const en = (k, v) => (c[k] || []).map(String).includes(String(v));
  const grupo = (titulo, html) => `<fieldset><legend>${titulo}</legend><div class="chips-f">${html}</div></fieldset>`;
  $('#pfil').innerHTML = `
    ${grupo('Estado', Object.entries(ESTADO_TXT).map(([k, t]) => chip('estado', k, t, en('estado', k))).join(''))}
    ${grupo(`Etiquetas <span class="ayuda">clic: lleva · otro clic: no lleva · otro: quitar</span>`, (o.etiquetas.length ? o.etiquetas.map((e) => {
      const inc = en('etiquetas', e.id), exc = en('sin_etiquetas', e.id);
      return `<button type="button" class="ch etq-f ${inc ? 'on' : exc ? 'no' : ''}" style="--c:${esc(e.color)}" data-etq="${e.id}" aria-label="${esc(e.nombre)}: ${inc ? 'lleva' : exc ? 'no lleva' : 'sin filtrar'}">${exc ? '⊘ ' : ''}${esc(e.nombre)}</button>`;
    }).join('') : '<span class="ayuda">Aún no hay etiquetas. Créalas en la pestaña Etiquetas.</span>')
      + chip('sin_ninguna', 'true', 'Sin ninguna etiqueta', Boolean(c.sin_ninguna))
      + ((c.etiquetas || []).length > 1 ? `<span class="modo-etq">Coinciden: ${chip('modo', 'alguna', 'alguna', c.modo !== 'todas')}${chip('modo', 'todas', 'todas', c.modo === 'todas')}</span>` : ''))}
    ${grupo('Sede', [...Object.entries(SEDES), ['sin_sede', 'Sin sede']].map(([k, t]) => chip('sede', k, t, en('sede', k))).join(''))}
    ${grupo('Canal', Object.entries(CANAL).map(([k, t]) => chip('canal', k, t, en('canal', k))).join(''))}
    ${grupo('Fase', [...FASES.map((f) => [f, f]), ['sin_fase', 'Sin fase']].map(([k, t]) => chip('fase', k, t, en('fase', k))).join(''))}
    <div class="fila-f">
      <label>Actividad <select id="fact"><option value="">Cualquiera</option>${[[1, 'Hoy'], [3, '3 días'], [7, '7 días'], [30, '30 días']].map(([d, t]) => `<option value="${d}" ${Number(c.actividad) === d ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Quién debe contestar <select id="fesp"><option value="">Cualquiera</option><option value="equipo" ${c.espera === 'equipo' ? 'selected' : ''}>Nosotros (último mensaje del lead)</option><option value="lead" ${c.espera === 'lead' ? 'selected' : ''}>El lead (último mensaje nuestro)</option></select></label>
    </div>
    <div class="acciones-f">
      <button type="button" id="flimpiar" ${vacios(c) ? 'disabled' : ''}>Quitar filtros</button>
      ${vista?.propia ? `<button type="button" id="factualizar" class="${cambiado ? 'primario' : ''}" ${cambiado ? '' : 'disabled'}>Guardar cambios en «${esc(vista.nombre)}»</button>
        <button type="button" id="frenombrar">Renombrar</button><button type="button" id="fborrar" class="peligro">Borrar vista</button>` : ''}
      <span class="guardar-vista"><input id="fnombre" placeholder="Nombre de la vista nueva" aria-label="Nombre de la vista nueva" maxlength="40"><button type="button" id="fguardar" class="${estado.creandoVista || (cambiado && !vista?.propia) ? 'primario' : ''}">Guardar como vista</button></span>
    </div>`;
  const aplicar = (n) => { estado.crit = n; estado.conv = null; pintarFiltros(); lista(); };
  $('#pfil').querySelectorAll('[data-k]').forEach((b) => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.val; const n = { ...c };
    if (k === 'sin_ninguna') { n.sin_ninguna ? delete n.sin_ninguna : (n.sin_ninguna = true); }
    else if (k === 'modo') n.modo = v;
    else { const l = new Set((n[k] || []).map(String)); l.has(v) ? l.delete(v) : l.add(v); n[k] = [...l]; if (!n[k].length) delete n[k]; }
    aplicar(n);
  });
  $('#pfil').querySelectorAll('[data-etq]').forEach((b) => b.onclick = () => {
    const id = Number(b.dataset.etq); const n = { ...c };
    const inc = new Set(n.etiquetas || []), exc = new Set(n.sin_etiquetas || []);
    if (inc.has(id)) { inc.delete(id); exc.add(id); } else if (exc.has(id)) exc.delete(id); else inc.add(id);
    n.etiquetas = [...inc]; n.sin_etiquetas = [...exc];
    for (const k of ['etiquetas', 'sin_etiquetas']) if (!n[k].length) delete n[k];
    if ((n.etiquetas || []).length < 2) delete n.modo;
    aplicar(n);
  });
  $('#fact').onchange = (e) => { const n = { ...c }; e.target.value ? n.actividad = Number(e.target.value) : delete n.actividad; aplicar(n); };
  $('#fesp').onchange = (e) => { const n = { ...c }; e.target.value ? n.espera = e.target.value : delete n.espera; aplicar(n); };
  $('#flimpiar').onclick = () => aplicar({});
  $('#fguardar').onclick = async () => {
    const nombre = $('#fnombre').value.trim();
    if (!nombre) { $('#fnombre').focus(); $('#fnombre').placeholder = 'Escribe un nombre para la vista'; return; }
    const { id } = await api('/panel/vistas', { method: 'POST', body: JSON.stringify({ nombre, criterios: c }) });
    estado.vista = String(id); estado.creandoVista = false; estado.panelFiltros = false; chats();
  };
  $('#factualizar') && ($('#factualizar').onclick = async () => { await api('/panel/vistas/' + vista.id, { method: 'PUT', body: JSON.stringify({ nombre: vista.nombre, criterios: c }) }); chats(); });
  $('#frenombrar') && ($('#frenombrar').onclick = () => {
    const sp = $('#frenombrar'); sp.outerHTML = `<span class="guardar-vista"><input id="frn" value="${esc(vista.nombre)}" aria-label="Nuevo nombre" maxlength="40"><button type="button" id="frnok" class="primario">Guardar nombre</button></span>`;
    $('#frn').focus();
    $('#frnok').onclick = async () => { await api('/panel/vistas/' + vista.id, { method: 'PUT', body: JSON.stringify({ nombre: $('#frn').value, criterios: vista.criterios }) }); chats(); };
  });
  $('#fborrar') && ($('#fborrar').onclick = async () => {
    const b = $('#fborrar');
    if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Seguro? Pulsa otra vez para borrar'; return; }
    await api('/panel/vistas/' + vista.id, { method: 'DELETE' }); estado.vista = 'todos'; estado.crit = {}; chats();
  });
  // Filtros activos como chips quitables
  const act = resumenCriterios(c, estado.opciones);
  $('#activos').innerHTML = act.length ? act.map(([k, v, t]) => `<button type="button" class="activo-f" data-qk="${k}" data-qv="${esc(v)}" aria-label="Quitar filtro ${esc(t)}">${esc(t)} ✕</button>`).join('') + (act.length > 1 ? '<button type="button" class="activo-f limpiar" id="qall">Quitar todos</button>' : '') : '';
  $('#activos').querySelectorAll('[data-qk]').forEach((b) => b.onclick = () => {
    const k = b.dataset.qk; let v = b.dataset.qv; if (['etiquetas', 'sin_etiquetas'].includes(k)) v = Number(v);
    aplicar(quitarCriterio(c, k, v));
  });
  $('#qall') && ($('#qall').onclick = () => aplicar({}));
  const bfil = $('#bfil'); if (bfil) bfil.innerHTML = `Filtros${act.length ? ` <span class="n">${act.length}</span>` : ''}`;
}

const normalizar = (c) => Object.fromEntries(Object.entries(c || {}).filter(([k, v]) => (Array.isArray(v) ? v.length : v) && !(k === 'modo' && (c.etiquetas || []).length < 2)).map(([k, v]) => [k, Array.isArray(v) ? [...v].map(String).sort() : v]).sort());

async function lista() {
  const pedido = JSON.stringify([estado.crit, estado.q]);
  const filas = await api(`/panel/conversaciones?criterios=${encodeURIComponent(JSON.stringify(estado.crit || {}))}&q=${encodeURIComponent(estado.q)}`);
  if (!$('#lista') || pedido !== JSON.stringify([estado.crit, estado.q])) return;
  $('#lista').innerHTML = filas.length ? filas.map((c) => `<button type="button" class="item ${estado.conv === c.id ? 'activo' : ''}" data-id="${esc(c.id)}">
    <div class="fila"><span class="nom">${esc(c.nombre || c.telefono || 'Sin nombre')}</span><span class="chip">${hora(c.ultimo_at || c.updated_at)}</span></div>
    <div class="ult">${c.ultimo_autor === 'lead' ? '<b class="punto" title="Espera respuesta"></b>' : c.ultimo_autor === 'ia' ? '✓ ' : ''}${esc(c.ultimo_texto || '')}</div>
    <div class="chips">${c.etiquetas.map((e) => pill(e)).join('')}${chipsConv(c)}</div></button>`).join('') : `<div class="vacio">${vacios(estado.crit) && !estado.q ? 'No hay chats todavía' : 'Ningún chat cumple estos filtros'}</div>`;
  $('#lista').querySelectorAll('.item').forEach((el) => el.onclick = () => abrir(el.dataset.id));
}

async function abrir(id) {
  estado.conv = id;
  $('#ch').classList.add('con-hilo');
  document.querySelectorAll('.item').forEach((el) => el.classList.toggle('activo', el.dataset.id === id));
  const d = await api('/panel/conversaciones/' + encodeURIComponent(id));
  if (estado.seccion !== 'chats' || estado.conv !== id) return;
  const c = d.conv;
  const ETQ = { lead: 'lead', ia: 'Sofía', humano: 'equipo', sistema: 'sistema' };
  const disponibles = (estado.opciones?.etiquetas || []).filter((e) => !d.etiquetas.some((x) => x.id === e.id));
  $('#hilo').innerHTML = `<div class="cab"><div><button class="volver" id="bv">Volver a chats</button> <b>${esc(c.nombre || c.telefono || 'Sin nombre')}</b> ${c.telefono ? `<span class="chip">${esc(c.telefono)}</span>` : ''}
      <div class="chips" style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">${chipsConv(c)}</div>${c.pause_reason ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(c.pause_reason)}</div>` : ''}</div>
      <div>${c.ai_paused || c.derivado ? '<button class="primario" id="bact">Reactivar Sofía</button>' : '<button class="peligro" id="bpau">Pausar Sofía</button>'}</div></div>
    <div class="etq-hilo">${d.etiquetas.map((e) => `<span class="etq-q">${pill(e)}<button type="button" class="x" data-quitar="${e.id}" aria-label="Quitar etiqueta ${esc(e.nombre)}">✕</button></span>`).join('')}
      ${disponibles.length ? `<select id="addetq" aria-label="Añadir etiqueta"><option value="">+ Añadir etiqueta</option>${disponibles.map((e) => `<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select>` : ''}</div>
    <div class="msgs" id="msgs">${d.mensajes.map((x) => `<div class="burbuja b-${esc(x.autor)} ${x.enviado ? '' : 'borrador'}">${esc(x.texto)}<div class="meta">${esc(ETQ[x.autor] || x.autor)} · ${hora(x.created_at)}${x.enviado ? '' : ' · borrador, no enviado'}${x.tipo === 'plantilla' ? ' · plantilla' : ''}</div></div>`).join('') || '<div class="vacio">Sin mensajes</div>'}</div>
    <div class="pie">${[
      c.analisis ? `<b>Lo que ha entendido Sofía</b><br>${esc(c.analisis)}${c.siguiente_paso ? `<br><span>Siguiente paso: ${esc(c.siguiente_paso)}</span>` : ''}` : '',
      d.altas.length ? '<b>Altas</b><br>' + d.altas.map((a) => `${hora(a.created_at)} · <span class="chip ${a.estado === 'preparada' ? 'verde' : a.estado === 'fallida' ? 'rojo' : 'ambar'}">${esc(a.estado)}</span> ${esc(a.datos.tarifa)} · ${esc(SEDES[a.datos.sede] || a.datos.sede)} · inicio ${esc(a.datos.fecha_inicio)}<br><span>${esc(a.detalle || '')}</span>`).join('<br>') : '',
      d.seguimientos.length ? '<b>Follow-ups</b><br>' + d.seguimientos.map((s) => `${esc(s.regla_id)} · ${hora(s.due_at)} · ${esc(s.estado)}${s.detalle ? ' · ' + esc(s.detalle) : ''}`).join('<br>') : '',
      d.ia.some((r) => r.error) ? '<b class="error">Errores de IA</b><br>' + d.ia.filter((r) => r.error).map((r) => `${hora(r.created_at)} · ${esc(r.error)}`).join('<br>') : '',
    ].filter(Boolean).join('<br><br>') || 'Las conversaciones se contestan en GHL. Desde aquí puedes revisar lo que hace Sofía, etiquetar y pausarla en este chat.'}</div>`;
  $('#msgs').scrollTop = 1e9;
  $('#bv').onclick = () => { estado.conv = null; $('#ch').classList.remove('con-hilo'); };
  const recargar = async () => { await lista(); abrir(id); };
  const accion = async (a) => { await api(`/panel/conversaciones/${encodeURIComponent(id)}/${a}`, { method: 'POST' }); recargar(); };
  $('#bact') && ($('#bact').onclick = () => accion('reanudar'));
  $('#bpau') && ($('#bpau').onclick = () => accion('pausar'));
  $('#addetq') && ($('#addetq').onchange = async (e) => { if (!e.target.value) return; await api(`/panel/conversaciones/${encodeURIComponent(id)}/etiquetas`, { method: 'POST', body: JSON.stringify({ etiqueta: Number(e.target.value) }) }); recargar(); });
  $('#hilo').querySelectorAll('[data-quitar]').forEach((b) => b.onclick = async () => { await api(`/panel/conversaciones/${encodeURIComponent(id)}/etiquetas/${b.dataset.quitar}`, { method: 'DELETE' }); recargar(); });
}

// ---------- Etiquetas ----------
const ACCIONES = [
  ['pausar_ia', '⏸️ Pausar a Sofía', 'Sofía deja de contestar en ese chat.'],
  ['reanudar_ia', '▶️ Reanudar a Sofía', 'Vuelve a contestar si estaba pausada o derivada.'],
  ['forzar_respuesta', '⚡ Forzar respuesta', 'Sofía contesta ya (respeta su horario). No actúa con reglas de inactividad.'],
  ['derivar', '🙋 Derivar al equipo', 'Pausa a Sofía y marca el chat como derivado.'],
  ['avisar', '🔔 Avisar al equipo', 'Manda un aviso por Telegram cuando se pone.'],
];
const REGLA_NUEVA = { texto: { tipo: 'texto', quien: 'lead', operador: 'contiene', patron: '' }, adjunto: { tipo: 'adjunto', quien: 'lead', media: 'cualquiera' }, inactividad: { tipo: 'inactividad', horas: 24 }, fase: { tipo: 'fase', fase: 'f5 cierre' }, sede: { tipo: 'sede', sede: 'parla' } };

async function etiquetas() {
  const r = await api('/panel/etiquetas');
  if (estado.seccion !== 'etiquetas') return;
  estado.catalogo = r;
  if (estado.editEtq) return editorEtiqueta(estado.editEtq === 'nueva' ? null : r.etiquetas.find((e) => e.id === estado.editEtq));
  const m = $('#main');
  m.innerHTML = `<div class="cab-seccion"><h2>Etiquetas</h2><div class="acciones-f"><button id="esync" title="Trae de GHL las etiquetas puestas o quitadas allí y reintenta las pendientes">Sincronizar con GHL</button><button id="eimport">Importar de GHL</button><button class="primario" id="enueva">+ Nueva etiqueta</button></div></div>
    <p class="intro">Ponlas a mano en cada chat, deja que se pongan solas con reglas (palabras, adjuntos, inactividad, fase o sede) o escribe un criterio para que las ponga Sofía. Al ponerse pueden pausar o reanudar a Sofía, derivar y avisar al equipo. Luego filtra los chats por ellas.</p>
    <p class="intro">🔄 <b>Sincronizadas con GHL</b>: cada etiqueta es un tag de GHL con el mismo nombre (en minúsculas). Lo que pongas o quites aquí se pone o quita en el contacto, y lo que pongan o quiten en GHL llega aquí (al momento por el webhook y, además, cada 15 minutos). Crear o renombrar una etiqueta la crea o renombra en GHL.</p>
    <div id="eimpp"></div><p id="esyncr" class="ayuda" role="status"></p>
    ${r.etiquetas.length ? `<div class="etq-grid">${r.etiquetas.map((e) => `<article class="etq-card ${e.activa ? '' : 'inactiva'}">
      <header>${pill(e)}<span class="chip">${e.chats} chat${e.chats === 1 ? '' : 's'}</span>${e.activa ? '' : '<span class="chip ambar">desactivada</span>'}</header>
      ${e.criterio_ia ? `<p class="criterio">✨ Sofía: ${esc(e.criterio_ia)}</p>` : ''}
      ${e.reglas_texto.length ? `<ul class="reglas">${e.reglas_texto.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${!e.criterio_ia && !e.reglas.length ? '<p class="ayuda">Solo a mano</p>' : ''}
      ${condicionesTexto(e, r.etiquetas)}
      <div class="acc">${ACCIONES.filter(([k]) => e.acciones[k]).map(([, t]) => `<span class="chip">${t}</span>`).join('')}</div>
      <footer><button data-ed="${e.id}">Editar</button>${e.reglas.some((x) => x.tipo !== 'inactividad') ? `<button data-ap="${e.id}" title="Busca en los chats que ya existen los que cumplen sus reglas">Aplicar a chats de antes</button>` : ''}
        <a href="#chats" data-fil="${e.id}">Ver chats</a></footer></article>`).join('')}</div>`
      : '<div class="vacio">Todavía no hay etiquetas. Crea la primera: por ejemplo «Interesado en Hyrox» con un criterio para Sofía, o «Lesión» con la regla «si el lead escribe la palabra lesión».</div>'}`;
  $('#enueva').onclick = () => { estado.editEtq = 'nueva'; etiquetas(); };
  $('#esync').onclick = async () => {
    const b = $('#esync'); b.disabled = true; b.textContent = 'Sincronizando…';
    let msg;
    try { const x = await api('/panel/etiquetas/sincronizar', { method: 'POST' }); msg = `Revisados ${x.contactos} contactos de GHL: ${x.puestas} etiquetas añadidas, ${x.quitadas} quitadas y ${x.subidas} subidas a GHL${x.errores ? ` (${x.errores} errores)` : ''}.`; }
    catch (err) { msg = err.message; }
    await etiquetas();
    if ($('#esyncr')) $('#esyncr').textContent = msg;
  };
  $('#eimport').onclick = async () => {
    const p = $('#eimpp'); p.innerHTML = '<div class="vacio">Leyendo las etiquetas de GHL…</div>';
    let tags; try { ({ tags } = await api('/panel/etiquetas/ghl')); } catch (err) { p.innerHTML = `<p class="error">${esc(err.message)}</p>`; return; }
    p.innerHTML = `<section class="importar"><h3>Importar de GHL</h3><p class="ayuda">Elige las que quieras gestionar desde aquí. Se crean sin reglas (solo a mano o desde GHL); luego puedes añadirles reglas o criterio para Sofía. Los chats que ya las llevan en GHL las recibirán al sincronizar.</p>
      <input id="ibusca" type="search" placeholder="Buscar entre ${tags.length} etiquetas de GHL" aria-label="Buscar etiquetas de GHL">
      <div class="chips-f lista-imp">${tags.map((t) => `<label class="ch"><input type="checkbox" value="${esc(t)}"> ${esc(t)}</label>`).join('') || '<span class="ayuda">Todas las etiquetas de GHL ya están en el panel.</span>'}</div>
      <div class="acciones-f"><button class="primario" id="iok">Importar seleccionadas</button><button id="icanc">Cancelar</button></div></section>`;
    $('#ibusca').oninput = (e) => { const q = e.target.value.toLowerCase(); p.querySelectorAll('.lista-imp label').forEach((l) => l.hidden = !l.textContent.toLowerCase().includes(q)); };
    $('#icanc').onclick = () => { p.innerHTML = ''; };
    $('#iok').onclick = async () => {
      const nombres = [...p.querySelectorAll('.lista-imp input:checked')].map((i) => i.value);
      if (!nombres.length) return;
      $('#iok').disabled = true; $('#iok').textContent = 'Importando…';
      const r = await api('/panel/etiquetas/importar', { method: 'POST', body: JSON.stringify({ nombres }) });
      estado.opciones = null; etiquetas();
      setTimeout(() => { if ($('#esyncr')) $('#esyncr').textContent = `Importadas ${r.creadas.length}${r.sync ? `; puestas en ${r.sync.puestas} chats que ya las llevaban en GHL` : ''}.`; }, 400);
    };
  };
  m.querySelectorAll('[data-ed]').forEach((b) => b.onclick = () => { estado.editEtq = Number(b.dataset.ed); etiquetas(); });
  m.querySelectorAll('[data-fil]').forEach((a) => a.onclick = () => { estado.vista = 'todos'; estado.crit = { etiquetas: [Number(a.dataset.fil)] }; estado.conv = null; });
  m.querySelectorAll('[data-ap]').forEach((b) => b.onclick = async () => {
    const e = r.etiquetas.find((x) => x.id === Number(b.dataset.ap));
    if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = `¿Buscar en todos los chats y poner «${e.nombre}»?`; b.classList.add('primario'); return; }
    b.disabled = true; b.textContent = 'Buscando…';
    const out = await api(`/panel/etiquetas/${e.id}/aplicar`, { method: 'POST' });
    b.textContent = out.aplicadas ? `Puesta en ${out.aplicadas} chat${out.aplicadas === 1 ? '' : 's'}` : 'Ningún chat nuevo la cumple';
    setTimeout(etiquetas, 1800);
  });
}

function condicionesTexto(e, todas) {
  const n = (ids) => ids.map((id) => todas.find((x) => x.id === id)?.nombre).filter(Boolean).map((x) => `«${esc(x)}»`).join(', ');
  return [e.solo_si.length ? `<p class="ayuda">Solo si ya lleva ${n(e.solo_si)}</p>` : '', e.nunca_si.length ? `<p class="ayuda">Nunca si lleva ${n(e.nunca_si)}</p>` : ''].join('');
}

        ${d.usarIA ? `<textarea id="ecrit" rows="3" maxlength="600" placeholder="Ej: el lead pregunta por Hyrox o dice que quiere competir">${esc(d.criterio_ia || '')}</textarea>
          <p class="ayuda">Escríbelo como se lo explicarías a una persona. Sofía lo revisa en cada respuesta.</p>` : ''}
        <h4>Reglas automáticas <span class="ayuda">(basta con que se cumpla una)</span></h4>
        <div id="ereglas">${d.reglas.map((r, i) => filaRegla(r, i)).join('') || '<p class="ayuda">Sin reglas.</p>'}</div>

      </section>

        ${['solo_si', 'nunca_si'].map((k) => `<div class="cond"><b>${k === 'solo_si' ? 'Solo si ya lleva' : 'Nunca si lleva'}</b><div class="chips-f">${otras.map((o) => `<button type="button" class="ch etq-f ${d[k].includes(o.id) ? 'on' : ''}" style="--c:${esc(o.color)}" data-cond="${k}" data-id="${o.id}" aria-pressed="${d[k].includes(o.id)}">${esc(o.nombre)}</button>`).join('')}</div></div>`).join('')}
      </section>` : ''}
      <section><h3>Al ponerse</h3>
        ${ACCIONES.map(([k, t, ayuda]) => `<label class="check"><input type="checkbox" data-acc="${k}" ${d.acciones[k] ? 'checked' : ''}> ${t} <span class="ayuda">${ayuda}</span></label>`).join('')}
      </section>
      <section><label class="check"><input type="checkbox" id="eact" ${d.activa ? 'checked' : ''}> Activa <span class="ayuda">(si la desactivas, las reglas y Sofía dejan de ponerla)</span></label></section>
      <p class="error" id="eerr" role="alert"></p>
      <div class="acciones-f"><button class="primario">${e ? 'Guardar cambios' : 'Crear etiqueta'}</button><button type="button" id="ecanc">Cancelar</button>
        ${e ? '<button type="button" id="eborrar" class="peligro">Borrar etiqueta</button>' : ''}</div>
    </form>`;
    const leer = () => {
      d.nombre = $('#enom').value; if ($('#ecrit')) d.criterio_ia = $('#ecrit').value;
      m.querySelectorAll('[data-acc]').forEach((c) => d.acciones[c.dataset.acc] = c.checked); d.activa = $('#eact').checked;
      m.querySelectorAll('[data-r]').forEach((el) => { const [i, campo] = el.dataset.r.split('.'); d.reglas[i][campo] = campo === 'horas' ? Number(el.value) : el.value; });
    };
    const re = () => { leer(); pintar(); };
    $('#enom').oninput = () => { m.querySelector('.vista-previa').innerHTML = pill({ nombre: $('#enom').value || 'Vista previa', color: d.color }); };
    m.querySelectorAll('[data-col]').forEach((b) => b.onclick = () => { d.color = b.dataset.col; re(); });
    $('#eia').onchange = (ev) => { leer(); d.usarIA = ev.target.checked; if (!d.usarIA) d.criterio_ia = ''; pintar(); $('#ecrit')?.focus(); };
    m.querySelectorAll('[data-nr]').forEach((b) => b.onclick = () => { leer(); d.reglas.push({ ...REGLA_NUEVA[b.dataset.nr] }); pintar(); });
    m.querySelectorAll('[data-delr]').forEach((b) => b.onclick = () => { leer(); d.reglas.splice(Number(b.dataset.delr), 1); pintar(); });
    m.querySelectorAll('[data-r]').forEach((el) => el.onchange = () => { if (el.tagName === 'SELECT') re(); });
    m.querySelectorAll('[data-cond]').forEach((b) => b.onclick = () => {
      leer(); const k = b.dataset.cond, otro = k === 'solo_si' ? 'nunca_si' : 'solo_si', id = Number(b.dataset.id);
      d[k] = d[k].includes(id) ? d[k].filter((x) => x !== id) : [...d[k], id]; d[otro] = d[otro].filter((x) => x !== id); pintar();
    });
    m.querySelectorAll('[data-acc]').forEach((c) => c.onchange = () => {
      leer();
      if (c.dataset.acc === 'pausar_ia' && c.checked) { d.acciones.reanudar_ia = false; d.acciones.forzar_respuesta = false; }
      if ((c.dataset.acc === 'reanudar_ia' || c.dataset.acc === 'forzar_respuesta') && c.checked) d.acciones.pausar_ia = false;
      pintar();
    });
    const salir = () => { estado.editEtq = null; etiquetas(); };
    $('#evolver').onclick = salir; $('#ecanc').onclick = salir;
    $('#eborrar') && ($('#eborrar').onclick = async () => {
      const b = $('#eborrar');
      if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = `¿Borrar? Se quitará de ${e.chats} chat${e.chats === 1 ? '' : 's'} (no de GHL)`; return; }
      await api('/panel/etiquetas/' + e.id, { method: 'DELETE' }); salir();
    });
    $('#fe').onsubmit = async (ev) => {
      ev.preventDefault(); leer();
      const cuerpo = { nombre: d.nombre, color: d.color, criterio_ia: d.usarIA ? d.criterio_ia : '', reglas: d.reglas, solo_si: d.solo_si, nunca_si: d.nunca_si, acciones: d.acciones, activa: d.activa };
      if (d.usarIA && !String(d.criterio_ia).trim()) { $('#eerr').textContent = 'Escribe el criterio para Sofía o desmarca esa opción.'; return; }
      try {
        await api(e ? '/panel/etiquetas/' + e.id : '/panel/etiquetas', { method: e ? 'PUT' : 'POST', body: JSON.stringify(cuerpo) });
        salir();
      } catch (err) { $('#eerr').textContent = err.message; }
    };
  };
  pintar();
}

function filaRegla(r, i) {
  const sel = (campo, ops) => `<select data-r="${i}.${campo}" aria-label="${campo}">${ops.map(([v, t]) => `<option value="${esc(v)}" ${String(r[campo]) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const quien = sel('quien', [['lead', 'el lead'], ['nosotros', 'nosotros'], ['cualquiera', 'cualquiera']]);
  let cuerpo = '';
  if (r.tipo === 'texto') cuerpo = `Si ${quien} ${sel('operador', [['contiene', 'escribe la palabra'], ['exacto', 'escribe exactamente'], ['empieza', 'empieza con'], ['termina', 'termina con']])} <input data-r="${i}.patron" value="${esc(r.patron)}" placeholder="palabra o frase" aria-label="Texto a buscar" maxlength="200">`;
  if (r.tipo === 'adjunto') cuerpo = `Si ${quien} envía ${sel('media', [['cualquiera', 'cualquier adjunto'], ['imagen', 'una imagen'], ['audio', 'un audio'], ['video', 'un vídeo'], ['documento', 'un documento']])}`;
  if (r.tipo === 'inactividad') cuerpo = `Si el lead no responde a nuestro último mensaje en <input type="number" min="1" max="1440" data-r="${i}.horas" value="${esc(r.horas)}" aria-label="Horas" style="width:80px"> horas`;
  if (r.tipo === 'fase') cuerpo = `Si Sofía pone el chat en la fase ${sel('fase', FASES.map((f) => [f, f]))}`;
  if (r.tipo === 'sede') cuerpo = `Si la sede del lead es ${sel('sede', Object.entries(SEDES))}`;
  return `<div class="regla-f">${cuerpo}<button type="button" class="x" data-delr="${i}" aria-label="Quitar regla">✕</button></div>`;
}

      <div class="ayuda">${sim.fecha ? `🕒 La IA cree que es ${new Date(d.ahora).toLocaleString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}` : 'Hora real'}${sim.telefono ? ` · 📱 ${esc(sim.telefono)}` : ''}</div></div>

  $('#pm').scrollTop = 1e9;

    catch (err) { const nd = await api('/probar/conversaciones/' + encodeURIComponent(c.id)).catch(() => d); if (p.id === c.id) { pintarPrueba(nd); $('#pm').insertAdjacentHTML('beforeend', `<div class="burbuja b-sistema error">${esc(err.message)}</div>`); } }

}

      ${c.ai_paused || c.derivado ? `<p class="aviso-mini">Sofía en pausa: ${esc(c.pause_reason || '')} <button type="button" id="preanudar">Reanudar</button></p>` : ''}`)}
    ${bloque('Etiquetas', `<div class="etq-hilo">${d.etiquetas.map((e) => `<span class="etq-q">${pill(e)}<button type="button" class="x" data-pq="${e.id}" aria-label="Quitar ${esc(e.nombre)}">✕</button></span>`).join('') || '<span class="ayuda">Ninguna todavía</span>'}
      ${disponibles.length ? `<select id="padd" aria-label="Añadir etiqueta"><option value="">+ Añadir etiqueta</option>${disponibles.map((e) => `<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select>` : ''}</div>`)}
    ${bloque('Lo que ha entendido', c.analisis ? `<p>${esc(c.analisis)}</p>` : '<p class="ayuda">Aparece tras la primera respuesta de Sofía.</p>')}
    ${bloque('Siguiente paso', c.siguiente_paso ? `<p>${esc(c.siguiente_paso)}</p>` : '')}
    ${bloque('Último turno', t ? `<ul class="herr">${t.herramientas.map((h) => `<li><details><summary>${HERR[h.nombre] || esc(h.nombre)}</summary><div class="ayuda">Pidió: ${resumirJson(h.entrada)}</div><div class="ayuda">Respuesta: ${resumirJson(h.resultado)}</div></details></li>`).join('') || '<li class="ayuda">Contestó sin consultar herramientas</li>'}</ul>
      ${t.etiquetas?.length ? `<p class="ayuda">✨ Etiquetas puestas: ${t.etiquetas.map(esc).join(', ')}</p>` : ''}${t.tags_ghl?.length ? `<p class="ayuda">Tags en GHL: ${t.tags_ghl.map(esc).join(', ')}</p>` : ''}` : '')}
    ${bloque('Follow-ups', `<p class="ayuda">En producción salen solos si el lead no contesta. «Forzar» lo lanza ya: Sofía decide si se cumple su condición.</p>
      <ul class="fu">${d.seguimientos.map((s) => `<li><span>${esc(s.nombre)} <span class="ayuda">· ${minutos(s.minutos)}${s.activo ? '' : ' · desactivado'}</span></span><button type="button" data-fu="${esc(s.id)}" ${estado.info.modelo_configurado && !escribiendo ? '' : 'disabled'}>Forzar</button></li>`).join('')}</ul>`)}
    ${bloque('Altas simuladas', d.altas.map((a) => `<p><span class="chip ambar">${esc(a.estado)}</span> ${esc(a.datos.nombre_completo || '')} · ${esc(a.datos.tarifa || '')} · ${esc(SEDES[a.datos.sede] || a.datos.sede || '')}</p>`).join(''))}`;
  const recargar = (nd) => { if (p.id === c.id) pintarPrueba(nd); };
  $('#padd') && ($('#padd').onchange = async (e) => { if (!e.target.value) return; try { recargar(await api(`/probar/conversaciones/${encodeURIComponent(c.id)}/etiquetas`, { method: 'POST', body: JSON.stringify({ etiqueta: Number(e.target.value) }) })); } catch (err) { alertaP(err.message); } });
  $('#panal').querySelectorAll('[data-pq]').forEach((b) => b.onclick = async () => recargar(await api(`/probar/conversaciones/${encodeURIComponent(c.id)}/etiquetas/${b.dataset.pq}`, { method: 'DELETE' })));
  $('#preanudar') && ($('#preanudar').onclick = async () => recargar(await api(`/probar/conversaciones/${encodeURIComponent(c.id)}/reanudar`, { method: 'POST' })));
  $('#panal').querySelectorAll('[data-fu]').forEach((b) => b.onclick = async () => {
    pintarPrueba(d, true);
    try { recargar(await api(`/probar/conversaciones/${encodeURIComponent(c.id)}/seguimiento`, { method: 'POST', body: JSON.stringify({ regla: b.dataset.fu }) })); }
    catch (err) { recargar(await api('/probar/conversaciones/' + encodeURIComponent(c.id))); alertaP(err.message); }
  });
}

function alertaP(texto) { $('#pm')?.insertAdjacentHTML('beforeend', `<div class="burbuja b-sistema error" role="alert">${esc(texto)}</div>`); }

async function descargar(ruta, nombre) {
  const cabecera = integrado ? { 'x-metrotools-client': 'zapp' } : { authorization: 'Bearer ' + token };
  const r = await fetch((integrado ? './api' : '/admin') + ruta, { headers: cabecera, cache: 'no-store' });
  if (!r.ok) return alertaP('No se ha podido exportar.');
  const url = URL.createObjectURL(await r.blob());
  const a = Object.assign(document.createElement('a'), { href: url, download: nombre });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function ajustes() {
  const a = await api('/panel/ajustes'); const i = estado.info;
  if (estado.seccion !== 'ajustes') return;
  const sw = (id, on, nombre) => `<label class="interruptor"><input type="checkbox" id="${id}" aria-label="${nombre}" ${on ? 'checked' : ''}><span></span></label>`;
  $('#main').innerHTML = `<h2>Ajustes</h2>
    <div class="ajuste"><div><div class="t">Sofía activa</div><div class="d">Apagada, no contesta ni manda follow-ups: todo lo atiende el equipo en GHL.</div></div>${sw('ia', a.ia_activa, 'Sofía activa')}</div>
    <div class="ajuste"><div><div class="t">WhatsApp</div><div class="d">Sofía contesta en WhatsApp</div></div>${sw('cw', a.canales.whatsapp, 'WhatsApp')}</div>
    <div class="ajuste"><div><div class="t">Instagram</div><div class="d">Sofía contesta en Instagram</div></div>${sw('ci', a.canales.instagram, 'Instagram')}</div>
    <div class="ajuste"><div><div class="t">Horario de respuesta</div><div class="d">Fuera de la franja, los mensajes se guardan y Sofía contesta al empezar el siguiente turno (0 = medianoche; en Zapp: 8 a 0)</div></div>
      <div style="display:flex;gap:6px;align-items:center"><input type="number" id="hi" aria-label="Hora de inicio" min="0" max="23" value="${a.horaInicio}" style="width:64px"> a <input type="number" id="hf" aria-label="Hora de fin" min="0" max="23" value="${a.horaFin}" style="width:64px"></div></div>
    <div class="ajuste"><div><div class="t">Tiempo de respuesta</div><div class="d">Espera al azar antes de contestar, en segundos, como una persona que ve el mensaje y lo lee (en Zapp: 15 a 50)</div></div>
      <div style="display:flex;gap:6px;align-items:center"><input type="number" id="dmin" aria-label="Retraso mínimo" min="0" value="${a.minDelay}" style="width:70px"> a <input type="number" id="dmax" aria-label="Retraso máximo" min="0" value="${a.maxDelay}" style="width:70px"></div></div>
    <div class="ajuste"><div><div class="t">Velocidad de escritura</div><div class="d">Letras por segundo mientras el lead ve «escribiendo…». Cuanto más largo el mensaje, más tarda (en Zapp: 4)</div></div>
      <input type="number" id="vel" aria-label="Velocidad de escritura" min="1" max="20" value="${a.typingSpeed}" style="width:70px"></div>
    <div style="display:flex;gap:10px;align-items:center;margin:14px 0"><button class="primario" id="bg">Guardar</button><span id="ok" role="status"></span></div>
    <h3>Sistema</h3>
    <div class="ajuste"><div><div class="t">Modo</div><div class="d">${i.modo === 'live' ? 'Enviando de verdad a los leads.' : 'Modo prueba: nada sale hacia los leads; quedan borradores para comparar con Zapp.'} El paso a real se hace en el servidor, cuando lo confirmes.</div></div><span class="chip ${i.modo === 'live' ? 'verde' : 'ambar'}">${i.modo === 'live' ? 'real' : 'prueba'}</span></div>
    <div class="ajuste"><div><div class="t">Alta en AimHarder</div><div class="d">${i.credenciales_alta ? 'Integración por navegador' : 'Faltan las credenciales de AimHarder.'}</div></div><span class="chip ${i.alta_en_pruebas ? 'ambar' : 'verde'}">${i.alta_en_pruebas ? 'Prueba' : 'Automática'}</span></div>
    <div class="ajuste"><div><div class="t">Modelo</div><div class="d">${i.modelo_configurado ? 'Redacta las respuestas de Sofía.' : 'Falta la clave de Anthropic.'}</div></div><span class="chip">${esc(i.modelo)}</span></div>`;
  $('#bg').onclick = async () => {
    try {
      estado.info.ajustes = await api('/panel/ajustes', { method: 'PUT', body: JSON.stringify({
        ia_activa: $('#ia').checked, canales: { whatsapp: $('#cw').checked, instagram: $('#ci').checked },
        horaInicio: Number($('#hi').value), horaFin: Number($('#hf').value), minDelay: Number($('#dmin').value), maxDelay: Number($('#dmax').value), typingSpeed: Number($('#vel').value),
      }) });
      $('#ok').innerHTML = '<span style="color:var(--green)">Guardado</span>';
      $('#raiz .modo .rojo')?.remove();
      if (!estado.info.ajustes.ia_activa) $('#raiz .modo').insertAdjacentHTML('beforeend', '<span class="chip rojo">IA pausada</span>');
    } catch (e) { $('#ok').innerHTML = `<span class="error">${esc(e.message)}</span>`; }
  };
}

integrado || token ? iniciar() : pintarLogin();
</script>
</body>
