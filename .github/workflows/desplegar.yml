# Despliegue automático al VPS: tests → SSH → trae la versión subida → reinicia con PM2.
# Secretos del repo (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (clave privada), opcionales VPS_PORT y VPS_KNOWN_HOSTS.
name: Desplegar al VPS

on:
  push:
    branches: [main, claude/clever-hamilton-3yaavv]
  workflow_dispatch:

concurrency:
  group: desplegar-vps
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - run: npm test

  desplegar:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Preparar SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" && test -n "$HOST" || { echo "Faltan los secretos VPS_SSH_KEY / VPS_HOST"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_vps && chmod 600 ~/.ssh/id_vps
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else ssh-keyscan -p "${PORT:-22}" "$HOST" > ~/.ssh/known_hosts; fi
      - name: Desplegar
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/id_vps -p "${PORT:-22}" "${USER:-root}@$HOST" \
            "cd /opt/metro-setter && git fetch --quiet origin $GITHUB_SHA && git checkout --quiet -f --detach $GITHUB_SHA && bash deploy/desplegar.sh"
