# Despliegue automático en el VPS al fusionar en main. Ver docs/despliegue.md.
# Apagado hasta que la variable del repositorio DESPLIEGUE_VPS valga «activo».
name: Desplegar en el VPS

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue cada vez; el segundo espera a que acabe el primero
concurrency:
  group: despliegue-vps
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: npm test

  desplegar:
    needs: pruebas
    if: vars.DESPLIEGUE_VPS == 'activo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "::error::Falta el secreto VPS_SSH_KEY"; exit 1; }
          test -n "$VPS_HOST_KEY" || { echo "::error::Falta el secreto VPS_HOST_KEY (huella del servidor)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/clave && chmod 600 ~/.ssh/clave
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Enviar el código y desplegar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" || { echo "::error::Faltan los secretos VPS_HOST o VPS_USER"; exit 1; }
          OPC="-i $HOME/.ssh/clave -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          PAQUETE="/tmp/zapp-${GITHUB_SHA}.tgz"
          git archive --format=tar.gz -o zapp.tgz HEAD
          scp $OPC -P "${VPS_PORT:-22}" zapp.tgz "$VPS_USER@$VPS_HOST:$PAQUETE"
          ssh $OPC -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "bash -s -- '$PAQUETE' '$GITHUB_SHA'" < deploy/desplegar.sh
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/clave
