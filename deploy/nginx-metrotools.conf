# Include in the apps.crossfitmpo.com HTTPS server.
location = /zapp { return 302 /zapp/; }

location ^~ /zapp/ {
    auth_request /_access_auth;
    auth_request_set $zapp_metro_admin $upstream_http_x_cfmpo_admin;
    proxy_set_header X-CFMPO-Admin $zapp_metro_admin;
    # Usuario de MetroTools (para el registro de actividad)
    auth_request_set $zapp_metro_user $upstream_http_x_cfmpo_user;
    proxy_set_header X-CFMPO-User $zapp_metro_user;
    include /etc/nginx/snippets/zapp-private-auth.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_pass http://127.0.0.1:3200/metrotools/;
    proxy_read_timeout 120s;
    client_max_body_size 256k;  # las instrucciones de Sofía pueden pasar de 64k

    # Subir un audio o imagen en Probar IA, o un archivo en Recursos (hasta 25 MB, en base64). Solo estas rutas admiten cuerpos grandes.
    location ~ ^/zapp/api/(probar/conversaciones/[A-Za-z0-9_-]+|panel/recursos)/adjunto$ {
        client_max_body_size 36m;
        proxy_read_timeout 300s;
        rewrite ^/zapp/(.*)$ /metrotools/$1 break;
        proxy_pass http://127.0.0.1:3200;
    }
}
