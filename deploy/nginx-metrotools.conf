# Include in the apps.crossfitmpo.com HTTPS server.
location = /zapp { return 302 /zapp/; }

location ^~ /zapp/ {
    auth_request /_access_auth;
    auth_request_set $zapp_metro_admin $upstream_http_x_cfmpo_admin;
    proxy_set_header X-CFMPO-Admin $zapp_metro_admin;
    include /etc/nginx/snippets/zapp-private-auth.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_pass http://127.0.0.1:3200/metrotools/;
    proxy_read_timeout 120s;
    client_max_body_size 64k;
}
