# Sofía · {{ID}} — bloque de nginx para {{DOMINIO}} (lo genera nuevo-cliente.sh).
# Expone el webhook de GHL, los webhooks de AimHarder, /health, los recursos públicos (/r/) y el panel (/panel + /admin,
# protegido por ADMIN_TOKEN). Todo lo demás da 404. Después: certbot --nginx -d {{DOMINIO}}
#
# Límite de peticiones al panel (frena a quien pruebe claves) y registro sin la parte «?…» de la URL (el webhook de
# AimHarder lleva su token ahí). Van una vez en el bloque http (p. ej. /etc/nginx/conf.d/sofia.conf):
#   limit_req_zone $binary_remote_addr zone=sofia_admin:10m rate=10r/s;
#   log_format sofia_sin_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name {{DOMINIO}};
    server_tokens off;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # La cabecera de usuario de MetroTools no se acepta desde fuera
    proxy_set_header X-CFMPO-User "";
    proxy_set_header X-CFMPO-Admin "";

    location = /webhooks/ghl { limit_except POST { deny all; } proxy_pass http://127.0.0.1:{{PUERTO}}; }
    location ~ ^/webhooks/aimharder/[a-z_]+$ { limit_except POST { deny all; } access_log /var/log/nginx/access.log sofia_sin_query; proxy_pass http://127.0.0.1:{{PUERTO}}; }
    location = /health { proxy_pass http://127.0.0.1:{{PUERTO}}; }
    location ^~ /r/ { limit_except GET HEAD { deny all; } proxy_pass http://127.0.0.1:{{PUERTO}}; }

    location = /panel { proxy_pass http://127.0.0.1:{{PUERTO}}; }
    location ^~ /admin/ {
        limit_req zone=sofia_admin burst=40 nodelay;
        proxy_read_timeout 120s;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:{{PUERTO}};
    }
    # Adjuntos del panel (audio, imagen o archivo en base64, hasta 25 MB)
    location ~ ^/admin/(probar/conversaciones/[A-Za-z0-9_-]+|panel/recursos|panel/conversaciones/[A-Za-z0-9_-]+)/adjunto$ {
        limit_req zone=sofia_admin burst=10 nodelay;
        client_max_body_size 36m;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:{{PUERTO}};
    }

    location / { return 404; }
}
