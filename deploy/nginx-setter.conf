# /etc/nginx/sites-available/setter.crossfitmpo.com  (luego: ln -s a sites-enabled, certbot --nginx -d setter.crossfitmpo.com)

# Límite para las rutas con clave: frena a quien intente adivinar el ADMIN_TOKEN.
limit_req_zone $binary_remote_addr zone=setter_panel:10m rate=5r/s;

server {
    server_name setter.crossfitmpo.com;

    # Webhook de GHL y salud.
    location = /webhooks/ghl { proxy_pass http://127.0.0.1:3200; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /health { proxy_pass http://127.0.0.1:3200; }

    # Panel de control: la página es pública; sus datos piden el ADMIN_TOKEN (Authorization: Bearer).
    location = /panel { proxy_pass http://127.0.0.1:3200; }
    location ^~ /admin/panel/ {
        limit_req zone=setter_panel burst=20 nodelay;
        proxy_pass http://127.0.0.1:3200; proxy_set_header X-Forwarded-For $remote_addr;
    }
    # «Probar IA» del panel (/admin/probar y /admin/probar/reiniciar).
    location ^~ /admin/probar {
        limit_req zone=setter_panel burst=10 nodelay;
        proxy_pass http://127.0.0.1:3200; proxy_set_header X-Forwarded-For $remote_addr;
    }

    # El resto de /admin (costes, reanudar por id) sigue accesible solo desde el propio VPS.
    location / { return 404; }

    listen 80;
}
