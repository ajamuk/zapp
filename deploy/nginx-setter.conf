# /etc/nginx/sites-available/setter.crossfitmpo.com  (luego: ln -s a sites-enabled, certbot --nginx -d setter.crossfitmpo.com)
# Las rutas viven en el repo (deploy/nginx-locations.conf) para que cada despliegue las actualice.
server {
    server_name setter.crossfitmpo.com;

    include /opt/metro-setter/deploy/nginx-locations.conf;

    listen 80;
}
