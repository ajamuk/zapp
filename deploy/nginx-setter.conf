# /etc/nginx/sites-available/setter.crossfitmpo.com  (luego: ln -s a sites-enabled, certbot --nginx -d setter.crossfitmpo.com)
server {
    server_name setter.crossfitmpo.com;
    client_max_body_size 1m;   # un webhook de GHL ocupa unos pocos KB
    server_tokens off;

    # Solo se expone el webhook de GHL y la salud. /admin queda accesible solo desde el propio VPS.
    location = /webhooks/ghl { proxy_pass http://127.0.0.1:3200; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location ~ ^/webhooks/aimharder/(parla|getafe|las_rosas)$ { limit_except POST { deny all; } proxy_pass http://127.0.0.1:3200; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /health { proxy_pass http://127.0.0.1:3200; }
    # Recursos que envía Sofía (GHL los descarga): solo lectura, con código aleatorio
    location ^~ /r/ { limit_except GET HEAD { deny all; } proxy_pass http://127.0.0.1:3200; proxy_set_header Host $host; }
    location / { return 404; }

    listen 80;
}
