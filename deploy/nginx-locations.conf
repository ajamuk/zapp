# Lo incluye el bloque server de setter.crossfitmpo.com (ver nginx-setter.conf).
# Se actualiza solo con cada despliegue: no editar en el VPS.

# Webhook de GHL y salud
location = /webhooks/ghl { proxy_pass http://127.0.0.1:3200; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
location = /health { proxy_pass http://127.0.0.1:3200; }

# Panel de control: la página es pública, los datos (/admin) piden ADMIN_TOKEN
location = /panel { proxy_pass http://127.0.0.1:3200; }
location /admin/ { proxy_pass http://127.0.0.1:3200; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 1m; }

location / { return 404; }
